openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Book My Cleaning — AI receptionist for Jobber cleaning companies
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: company
  - name: phone
  - name: services
  - name: team
  - name: calls
  - name: bookings
  - name: dashboard
  - name: map
  - name: schedule
  - name: staff
  - name: leads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /company:
    get:
      operationId: getCompany
      tags: [company]
      summary: Get the current user's company (404 if none yet)
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: No company yet
    post:
      operationId: createCompany
      tags: [company]
      summary: Create the company workspace for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    patch:
      operationId: updateCompany
      tags: [company]
      summary: Update company settings / receptionist configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /company/jobber/connect:
    post:
      operationId: connectJobber
      tags: [company]
      summary: Start Jobber OAuth — returns an authorizeUrl to redirect the user to Jobber
      responses:
        "200":
          description: OAuth start — redirect the browser to authorizeUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobberConnectStart"
        "503":
          description: Jobber API credentials not configured
  /company/jobber/disconnect:
    post:
      operationId: disconnectJobber
      tags: [company]
      summary: Disconnect Jobber and revoke app access
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /company/jobber/sync-calendar:
    post:
      operationId: syncJobberCalendar
      tags: [company]
      summary: Pull scheduled Jobber jobs onto our calendar and map right now
      description: >-
        Runs the same import as the background sync, on demand, over a rolling
        window around today. Only ever creates or updates bookings this import
        owns — a booking taken by the receptionist is never touched.
      responses:
        "200":
          description: Sync finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobberCalendarSync"
        "400":
          description: Jobber isn't connected, or the sync failed
  /company/go-live:
    post:
      operationId: goLive
      tags: [company]
      summary: Mark setup complete and take the receptionist live
      responses:
        "200":
          description: Live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /company/jobber/skip:
    post:
      operationId: setJobberSkipped
      tags: [company]
      summary: Skip Jobber (or un-skip it) and run bookings inside Book My Cleaning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobberSkipInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /company/jobber-connections:
    get:
      operationId: listJobberConnections
      tags: [company]
      summary: List all Jobber connections for this company (owner/dispatcher)
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobberConnection"
  /company/jobber-connections/{id}:
    patch:
      operationId: updateJobberConnection
      tags: [company]
      summary: Rename a Jobber connection (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobberConnectionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobberConnection"
        "404":
          description: Connection not found
    delete:
      operationId: deleteJobberConnection
      tags: [company]
      summary: Revoke and remove one Jobber connection (owner only)
      description: >-
        Calls Jobber's appDisconnect mutation best-effort, then removes the
        connection row. Staff assigned to it are left unassigned so they fall
        back to the remaining primary connection.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Disconnected
        "404":
          description: Connection not found
  /company/quo/connect:
    post:
      operationId: connectQuo
      tags: [phone]
      summary: Connect this company's own Quo workspace with their API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectQuoInput"
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /company/quo/disconnect:
    post:
      operationId: disconnectQuo
      tags: [phone]
      summary: Disconnect the Quo workspace and remove registered webhooks
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /quo/numbers:
    get:
      operationId: listQuoNumbers
      tags: [phone]
      summary: List the real phone numbers in the connected Quo workspace
      responses:
        "200":
          description: Quo numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoNumber"
    post:
      operationId: selectQuoNumbers
      tags: [phone]
      summary: Choose which Quo lines the receptionist watches and register webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoNumberSelection"
      responses:
        "200":
          description: Watched lines updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /calls/sync:
    post:
      operationId: syncCallsFromQuo
      tags: [calls]
      summary: Backfill recent calls, Sona transcripts, and summaries from Quo
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List the company's services and price ranges
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /services/suggested-catalog:
    post:
      operationId: importSuggestedServices
      tags: [services]
      summary: Add the suggested cleaning-service catalog without duplicating existing names
      responses:
        "200":
          description: Suggested services now available to the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedServicesImportResult"
  /services/{id}:
    patch:
      operationId: updateService
      tags: [services]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [services]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /me:
    get:
      operationId: getCurrentUser
      tags: [team]
      summary: The signed-in account's seat within its company
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /bookings/{id}/crew:
    put:
      operationId: setBookingCrew
      tags: [bookings]
      summary: Set which cleaners are working a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBookingCrewInput"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found
  /bookings/{id}/timer/start:
    post:
      operationId: startBookingTimer
      tags: [bookings]
      summary: Clock on to a job
      description: >
        Starts the on-site clock. Idempotent: if the clock is already running,
        the same stretch is returned rather than a second one being opened —
        a crew member tapping twice on a weak signal must not double-bill.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking with the clock running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found
  /bookings/{id}/timer/stop:
    post:
      operationId: stopBookingTimer
      tags: [bookings]
      summary: Clock off a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking with the finished time recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found
        "409":
          description: The clock was not running
  /bookings/{id}/invoice:
    post:
      operationId: createBookingInvoice
      tags: [bookings]
      summary: Create a Jobber invoice from this booking's quote
      description: >
        Builds an unsent invoice in Jobber for the booking's client using the
        quoted line items (or the flat quoted amount), with a credit line for
        any deposit already paid. Idempotent — a booking that already has an
        invoice returns unchanged rather than minting a second one. The office
        reviews and sends the invoice from Jobber.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking with the invoice recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Jobber not connected, or this booking has no Jobber client yet
        "404":
          description: Booking not found
        "409":
          description: Jobber authorization has expired
  /team:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List team members
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: inviteTeamMember
      tags: [team]
      summary: Invite a dispatcher or cleaner by name and email
      description: >-
        Sends a real Clerk sign-up invitation to the address. The seat is
        claimed the first time that person signs in with the address verified
        on their account, so the invite still works if the email bounces.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
  /team/join-code:
    get:
      operationId: getJoinCode
      tags: [team]
      summary: The code the crew types when signing up (owner/dispatcher)
      description: >-
        Generated on first use, so companies created before join codes existed
        get one the moment somebody looks. Not a credential — it only decides
        whose Staff page a sign-up request lands on, and nothing happens until
        that request is approved.
      responses:
        "200":
          description: Join code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinCode"
  /team/join-code/rotate:
    post:
      operationId: rotateJoinCode
      tags: [team]
      summary: Retire the current join code and mint a new one (owner only)
      description: >-
        For when the code has been passed around beyond the crew. The old code
        stops matching immediately; existing staff and outstanding join
        requests are untouched, because the code only gates NEW requests.
      responses:
        "200":
          description: The replacement code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinCode"
  /team/join-requests:
    post:
      operationId: requestToJoinCompany
      tags: [team]
      summary: Ask to join a company using its join code
      description: >-
        For someone who signed up on their own rather than following an invite.
        Creates a seat with status `pending`, which grants no access whatsoever
        until an owner or dispatcher approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequestInput"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequestResult"
    delete:
      operationId: cancelJoinRequest
      tags: [team]
      summary: Withdraw your own pending request to join
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequestResult"
  /team/{id}/approve:
    post:
      operationId: approveTeamMember
      tags: [team]
      summary: Let a pending sign-up into the company
      description: >-
        Turns a pending request into a working seat. A dispatcher may approve
        someone as a cleaner; only the owner can hand out a dispatcher seat.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveTeamMemberInput"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
  /team/{id}/decline:
    post:
      operationId: declineTeamMember
      tags: [team]
      summary: Turn down a pending sign-up
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequestResult"
  /team/import:
    post:
      operationId: importTeamMembers
      tags: [team]
      summary: Add or update staff in bulk from a spreadsheet
      description: >-
        Takes the rows of a staff spreadsheet the owner exported, edited and
        uploaded again. Rows are matched to existing people by email, or by
        name when they have no email, so a round trip updates rather than
        duplicates. Bad rows are reported, never fatal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportTeamMembersInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportTeamMembersResult"
  /team/jobber-members:
    get:
      operationId: listJobberTeamMembers
      tags: [team]
      summary: Jobber's active team members, with their link status here
      description: >-
        Owner/dispatcher only, and only when Jobber is connected. Each entry
        says whether that Jobber user is already linked to a staff member,
        and — when unlinked — which staff member the sync's own name matching
        would suggest, so what the owner confirms is exactly what a sync
        would have done. Also includes an entry (gone=true) for each roster
        member whose stored link points at a Jobber user no longer in
        Jobber's active list, so a deactivated Jobber account never leaves
        a stale link invisible.
      responses:
        "200":
          description: Jobber team members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobberTeamMembersResult"
        "400":
          description: Jobber is not connected
        "409":
          description: Jobber authorization has expired
  /team/jobber-members/import:
    post:
      operationId: importJobberUser
      tags: [team]
      summary: Add a Jobber user to the roster as a new staff seat (owner only)
      description: >-
        For a Jobber team member who has no counterpart here. Creates a
        roster-only cleaner seat — no email, no login — already linked to the
        Jobber user, so their visits colour correctly from the next sync on.
        Nothing is created without this explicit call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportJobberUserInput"
      responses:
        "201":
          description: Created and linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          description: Jobber is not connected
        "404":
          description: No active Jobber user with that id
        "409":
          description: That Jobber user is already linked to a staff member
  /team/{id}/jobber-link:
    post:
      operationId: linkJobberUser
      tags: [team]
      summary: Link a staff member to a Jobber user (owner only)
      description: >-
        From then on assignment sync in both directions keys on the link, so
        renaming the person on either side changes nothing. Relinking a staff
        member to a different Jobber user replaces their old link.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkJobberUserInput"
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          description: Jobber is not connected
        "404":
          description: Staff member not found
        "409":
          description: That Jobber user is already linked to someone else
    delete:
      operationId: unlinkJobberUser
      tags: [team]
      summary: Remove a staff member's Jobber link (owner only)
      description: >-
        The staff member stays on the roster; the sync just goes back to
        name matching for them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unlinked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "404":
          description: Staff member not found
  /team/{id}/account:
    delete:
      operationId: revokeTeamMemberAccount
      tags: [team]
      summary: >-
        Revoke a staff member's Clerk login without removing the seat (owner only)
      description: >-
        Clears the Clerk user id and invitation so the person can no longer sign
        in. The roster seat stays — name, phone, Jobber link, and all history are
        preserved — and the owner can invite someone new to the same seat. Does
        NOT remove the team_members row; use DELETE /team/{id} for a full remove.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Credentials cleared, seat preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          description: Cannot revoke access from your own seat
        "404":
          description: Team member not found
  /team/{id}:
    patch:
      operationId: updateTeamMember
      tags: [team]
      summary: Edit a staff member's details
      description: >-
        Saves whatever the owner changed on the staff card. A new home address
        is geocoded here so it can be pinned on the live map. Adding an email
        to someone who had none also sends them a sign-up invitation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
    delete:
      operationId: removeTeamMember
      tags: [team]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
  # ── Customer texting ────────────────────────────────────────────────
  # The business line, both directions. Dispatch-only: a text thread carries
  # prices and addresses, so the crew role is not on these routes at all.
  /messages/threads:
    get:
      operationId: listMessageThreads
      tags: [messages]
      summary: The customer inbox, newest activity first
      responses:
        "200":
          description: Threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageThread"
    post:
      operationId: startMessageThread
      tags: [messages]
      summary: Open (or reopen) the thread for a phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartThreadInput"
      responses:
        "200":
          description: The thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThread"
  /messages/unread-count:
    get:
      operationId: getUnreadMessageCount
      tags: [messages]
      summary: Unread inbound texts, for the sidebar badge
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties:
                  unread: { type: integer }
  /messages/threads/{id}:
    get:
      operationId: getMessageThread
      tags: [messages]
      summary: One conversation in full. Opening it clears the unread badge.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema:
                type: object
                required: [thread, messages]
                properties:
                  thread:
                    $ref: "#/components/schemas/MessageThread"
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientMessage"
        "404":
          description: No such conversation for this caller
  /messages/threads/{id}/messages:
    post:
      operationId: sendClientMessage
      tags: [messages]
      summary: Reply from the business line
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "200":
          description: The sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientMessage"
        "409":
          description: Quo is not connected or no line is chosen
        "502":
          description: Quo refused the message
  # ── Staff chat ──────────────────────────────────────────────────────
  # Open to every role, cleaners included. Access to one conversation is
  # decided by membership, never by role.
  /staff-chat/conversations:
    get:
      operationId: listStaffConversations
      tags: [staffChat]
      summary: Conversations this person is in
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffConversation"
    post:
      operationId: startStaffConversation
      tags: [staffChat]
      summary: Start a direct chat or a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartStaffConversationInput"
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffConversation"
  /staff-chat/contacts:
    get:
      operationId: listChatContacts
      tags: [staffChat]
      summary: Teammates this person can message
      responses:
        "200":
