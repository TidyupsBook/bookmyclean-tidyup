      operationId: syncLeadToJobber
      tags: [leads]
      summary: Retry sending a website-form lead into Jobber
      description: >-
        Form leads push themselves to Jobber the moment they are submitted, so
        this button is the retry after a failure. Idempotent: a client or
        request Jobber already created for this lead is reused, never minted
        again. Sheet leads are never pushed and are refused here.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pushed (or already in Jobber)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Not a website-form lead, or Jobber isn't connected
        "404":
          description: Lead not found
