      responses:
        "200":
          description: Map config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapConfig"
  /map/address-suggestions:
    get:
      operationId: getAddressSuggestions
      tags: [map]
      summary: Address suggestions for an address box, looked up server-side
      parameters:
        - name: q
          in: query
          required: true
          description: What has been typed so far. Fewer than 3 characters returns nothing.
          schema:
            type: string
        - name: lat
          in: query
          required: false
          description: Bias results toward this point (the company's area).
          schema:
            type: number
        - name: lng
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Address suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressSuggestions"
  /map/geocode:
    get:
      operationId: geocodeMapAddress
      tags: [map]
      summary: Place a typed address on the map without saving anything
      description: >-
        Answers "where is this?" for a one-off lookup — measuring distances to a
        customer's address, say — so the dispatcher doesn't have to save a pin
        just to ask a question. Resolved server-side, like every other geocode,
        so the key never reaches the browser.
      parameters:
        - name: address
          in: query
          required: true
          description: >-
            A postal address. Bounded because every distinct value is a paid
            lookup at Google — no real address is anywhere near this long.
          schema:
            type: string
            maxLength: 250
        - name: lat
          in: query
          required: false
          description: >-
            Bias the answer toward the area this company works in, so a street
            name that also exists in another province or country resolves to
            the local one. A bias, not a fence: an address genuinely elsewhere
            still resolves when it's the only match.
          schema:
            type: number
        - name: lng
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Where that address is, or a plain "couldn't place it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodedAddress"
  /map/data:
    get:
      operationId: getMapData
      tags: [map]
      summary: Live cleaner positions, that day's job pins, and saved pins
      parameters:
        - name: date
          in: query
          required: false
          description: Day to show jobs for, YYYY-MM-DD in the company's timezone.
          schema:
            type: string
        - name: end
          in: query
          required: false
          description: >-
            Last day of the range, YYYY-MM-DD in the company's timezone. When
            given, jobs cover every day from `date` to `end` inclusive so the
            week and month views can pin a whole span at once. Omit for a
            single day.
          schema:
            type: string
        - name: all
          in: query
          required: false
          description: >-
            Ignore the date range and pin every located job the caller may see,
            one pin per address rather than one per visit. Answers "where are
            my clients" instead of "where is the crew today"; `date` and `end`
            are ignored when set.
          schema:
            type: boolean
      responses:
        "200":
          description: Map data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapData"
  /map/routes:
    get:
      operationId: getMapRoutes
      tags: [map]
      summary: The trail from each live cleaner to their next job today, with ETA
      responses:
        "200":
          description: >-
            One route per cleaner whose phone is reporting and who has a
            located, still-relevant job today. Cleaners get only their own
            trail; dispatch sees the whole crew's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapRoutes"
  /map/driving-route:
    get:
      operationId: getMapDrivingRoute
      tags: [map]
      summary: Get an actual driving route between two map points
      parameters:
        - name: startLat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: startLng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: endLat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: endLng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: The Google driving route. No straight-line fallback is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapDrivingRoute"
        "503":
          description: Google could not provide a driving route
  /map/pins:
    post:
      operationId: createMapPin
      tags: [map]
      summary: Save a map pin, geocoding the address when coordinates are absent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePinInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapPin"
        "400":
          description: Could not resolve the pin to coordinates
  /map/pins/{id}:
    patch:
      operationId: updateMapPin
      tags: [map]
      summary: Rename, re-address or move a saved map pin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePinInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapPin"
        "400":
          description: Could not resolve the new address to coordinates
        "404":
          description: Pin not found
    delete:
      operationId: deleteMapPin
      tags: [map]
      summary: Delete a map pin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /saved-routes:
    get:
      operationId: listSavedRoutes
      tags: [map]
      summary: List saved cleaner routes
      responses:
        "200":
          description: Saved routes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SavedRoute" }
    post:
      operationId: createSavedRoute
      tags: [map]
      summary: Create a named route for a team member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedRouteInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedRoute" }
  /saved-routes/{id}:
    get:
      operationId: getSavedRoute
      tags: [map]
      summary: Get a saved route and its ordered stops
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Saved route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedRoute" }
    patch:
      operationId: updateSavedRoute
      tags: [map]
      summary: Rename or reassign a saved route
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedRouteUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedRoute" }
    delete:
      operationId: deleteSavedRoute
      tags: [map]
      summary: Delete a saved route
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
  /saved-routes/{id}/stops:
    post:
      operationId: addSavedRouteStop
      tags: [map]
      summary: Add a stop to a saved route
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedRouteStopInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedRouteStop" }
  /saved-routes/{id}/stops/reorder:
    put:
      operationId: reorderSavedRouteStops
      tags: [map]
      summary: Set saved route stop order
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedRouteStopOrder" }
      responses:
        "200":
          description: Reordered route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedRoute" }
  /saved-routes/{routeId}/stops/{stopId}:
    get:
      operationId: getSavedRouteStop
      tags: [map]
      summary: Get one stop for booking prefill
      parameters:
        - { name: routeId, in: path, required: true, schema: { type: integer } }
        - { name: stopId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Stop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedRouteStop" }
    patch:
      operationId: updateSavedRouteStop
      tags: [map]
      summary: Edit a saved route stop
      parameters:
        - { name: routeId, in: path, required: true, schema: { type: integer } }
        - { name: stopId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedRouteStopUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedRouteStop" }
    delete:
      operationId: deleteSavedRouteStop
      tags: [map]
      summary: Delete a saved route stop
      parameters:
        - { name: routeId, in: path, required: true, schema: { type: integer } }
        - { name: stopId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
  /staff/location:
    post:
      operationId: reportStaffLocation
      tags: [staff]
      summary: The calling team member reports their own GPS position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLocationInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLocation"
  /staff/presence:
    get:
      operationId: getStaffPresence
      tags: [staff]
      summary: Which team members' devices reported a position in the last few minutes
      responses:
        "200":
          description: Live team member ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPresence"
  /staff/devices:
    get:
      operationId: listStaffDevices
      tags: [staff]
      summary: Every device in the company, who it belongs to, and whether it's live
      description: >-
        The owner's tracking page. Lists each person on the roster with the
        devices they have signed in from, their last-seen times and their
        current positions, plus the per-person live-location switch. Owner
        only — this is the whole company's whereabouts on one screen.
      responses:
        "200":
          description: Devices grouped by the person they belong to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDevices"
  /staff/devices/{id}:
    patch:
      operationId: renameStaffDevice
      tags: [staff]
      summary: Rename one device
      description: >-
        Give a device the name it should carry on the map and the tracking
        page — "Tidyups Location", "Richard's iPad". The owner may rename any
        device in the company; anybody else may rename only their own. The name
        sticks: a device reporting its position never overwrites a name that
        was set here.
      parameters:
        - name: id
          in: path
          required: true
          description: The device id being renamed.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameStaffDeviceInput"
      responses:
        "200":
          description: The device as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDeviceEntry"
        "400":
          description: The name was empty
        "403":
          description: Not your device
        "404":
          description: No such device in this company
    delete:
      operationId: deleteStaffDevice
      tags: [staff]
      summary: Permanently forget one device
      description: >-
        Owner only. Removes the device and its stored position, so it
        disappears from the tracking page and the map. Not undoable — but the
        person keeps their seat and their account, and the same physical
        device simply reappears as a new device if it ever reports again.
      parameters:
        - name: id
          in: path
          required: true
          description: The device id being deleted.
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: No such device in this company
  /staff/devices/{id}/office:
    put:
      operationId: setOfficeDevice
      tags: [staff]
      summary: Mark one device as the office, or unmark it
      description: >-
        Owner only. The office is a place, not a crew member: the flagged
        device is drawn as a building parked on the company's stored office
        location, and never on whatever the browser last reported. One device
        per company — marking a new one clears the old flag. Marking requires
        an office address the first time (it is geocoded server-side and
        stored on the company); after that the saved spot is reused unless a
        new address is sent.
      parameters:
        - name: id
          in: path
          required: true
          description: The device id being marked or unmarked.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOfficeDeviceInput"
      responses:
        "200":
          description: The device's office flag and the stored office spot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetOfficeDeviceResult"
        "400":
          description: No office address stored yet, or one that couldn't be placed
        "404":
          description: No such device in this company
  /schedule:
    get:
      operationId: getSchedule
      tags: [schedule]
      summary: The day's schedule — owners/dispatchers see all, cleaners see their own
      parameters:
        - name: date
          in: query
          required: false
          description: Day to show, YYYY-MM-DD in the company's timezone.
          schema:
            type: string
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: The company's client directory, A→Z (owner/dispatcher only)
      responses:
        "200":
          description: Every known client for this company
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientRecord"
    post:
      operationId: createClient
      tags: [clients]
      summary: Add a client contact (owner/dispatcher only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRecord"
  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client contact (owner/dispatcher only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRecord"
        "404": { description: Not found }
  /callers:
    get:
      operationId: listCallers
      tags: [calls]
      summary: Company callers directory, most recently called first (owner/dispatcher only)
      responses:
        "200":
          description: Callers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Caller" }
  /callers/{id}/calls:
    get:
      operationId: listCallerCalls
      tags: [calls]
      summary: Calls associated with one caller (owner/dispatcher only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Calls
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Call" }
        "404": { description: Not found }
  /jobber-quotes:
    get:
      operationId: listJobberQuotes
      tags: [jobber]
      summary: Quotes created in Jobber, mirrored here with their status (owner/dispatcher only)
      responses:
        "200":
          description: Jobber quotes, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobberQuote"
  /jobber-invoices:
    get:
      operationId: listJobberInvoices
      tags: [jobber]
      summary: Invoices created in Jobber, mirrored here with paid/pending standing (owner/dispatcher only)
      responses:
        "200":
          description: Jobber invoices, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobberInvoice"
  /customer-tags/{kind}/{id}:
    patch:
      operationId: updateCustomerTag
      tags: [customers]
      summary: Set or clear a customer's quick verdict from any dashboard surface
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [lead, call, booking, invoice, client]
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdateInput"
      responses:
        "200":
          description: The saved verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerTagResult"
        "404":
          description: The record is not in this company
  /search:
    get:
      operationId: searchDirectory
      tags: [search]
      summary: Find a person by name or phone across leads, bookings, clients and staff (owner/dispatcher only)
      parameters:
        - name: q
          in: query
          required: true
          description: Name fragment or phone number (any format). At least 2 characters.
          schema:
            type: string
      responses:
        "200":
          description: Matches grouped by kind, best-effort limited per category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchDirectoryResult"
components:
  schemas:
    SearchMatch:
      type: object
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [lead, booking, client, team]
        id: { type: integer }
        name: { type: string }
        phone:
          type: string
          nullable: true
        # A one-line disambiguator — address, service, or role.
        detail:
          type: string
          nullable: true
        # Booking start (ISO) so the schedule hit can say when.
        date:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
    SearchDirectoryResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchMatch"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        # A live probe of the production database, so the dashboard can warn
        # the owner when the endpoint is paused (asleep) before a publish
        # fails. "paused" is the SQLSTATE 28000 / "endpoint has been disabled"
        # signature; "error" is any other database failure.
        database:
          type: string
          enum: [ok, paused, error]
      required: [status, database]
    CustomQuestion:
      type: object
      required: [question, answer]
      properties:
        question: { type: string }
        answer: { type: string }
    CompanyInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        timezone:
          type: string
          minLength: 1
          description: IANA time zone detected by the browser (e.g. America/Toronto)
    CompanyUpdate:
      type: object
      properties:
        name: { type: string }
        greeting: { type: string }
        collectFields:
          type: array
          items: { type: string }
        customQuestions:
          type: array
          items:
            $ref: "#/components/schemas/CustomQuestion"
        ringThroughNumber: { type: string }
        # Fallback number for owner outage/recovery texts when no ring-through
        # number is set.
        notificationNumber: { type: string }
        # IANA zone name, e.g. America/Edmonton. Validated server-side against
        # the runtime's timezone database.
        timezone: { type: string, minLength: 1 }
        quoteRateSolo: { type: number, minimum: 0, maximum: 10000 }
        quoteRateTeam: { type: number, minimum: 0, maximum: 10000 }
        quoteFuelSurcharge: { type: number, minimum: 0, maximum: 10000 }
        quoteTaxLabel: { type: string, minLength: 1 }
        quoteTaxRate: { type: number, minimum: 0, maximum: 100 }
        quoteFeesLabel: { type: string, minLength: 1 }
        quoteFeesRate: { type: number, minimum: 0, maximum: 100 }
        quoteDepositAmount: { type: number, minimum: 0, maximum: 1000000 }
        quoteDepositEmail: { type: ["string", "null"] }
        # Which booking-form boxes must be filled before a booking saves.
        # Empty means everything is optional except the date. The dashboard
        # form, the Bookings dialog and the phone app all read this one list.
        bookingRequiredFields:
          type: array
          maxItems: 6
          items:
            type: string
            enum: [name, phone, email, address, service, time]
        # Minutes the mobile "Take booking" shortcut stays on a finished call.
        recentCallWindowMinutes: { type: integer, minimum: 5, maximum: 1440 }
    ConnectQuoInput:
      type: object
      required: [apiKey]
      properties:
        apiKey: { type: string }
    QuoNumberSelection:
      type: object
      required: [numberIds]
      properties:
        numberIds:
          type: array
          items: { type: string }
    QuoNumber:
      type: object
      required: [id, phoneNumber]
      properties:
        id: { type: string }
        phoneNumber: { type: string }
        name: { type: ["string", "null"] }
        watched: { type: boolean }
    WatchedNumber:
      type: object
      required: [id, phoneNumber, name, watched]
      properties:
        id: { type: string }
        phoneNumber: { type: string }
        name: { type: string }
        watched: { type: boolean }
    SetupStatus:
      type: object
      required:
        [
          accountCreated,
          jobberConnected,
          jobberSkipped,
          jobberResolved,
          quoConnected,
          phoneProvisioned,
          receptionistConfigured,
          teamInvited,
          isLive,
          completedSteps,
          totalSteps,
        ]
      properties:
        accountCreated: { type: boolean }
        jobberConnected: { type: boolean }
        jobberSkipped: { type: boolean }
        # True once the owner has made a choice either way, so the wizard can
        # advance. Connecting Jobber later un-skips it.
        jobberResolved: { type: boolean }
        quoConnected: { type: boolean }
        phoneProvisioned: { type: boolean }
        receptionistConfigured: { type: boolean }
        teamInvited: { type: boolean }
        isLive: { type: boolean }
        completedSteps: { type: integer }
        totalSteps: { type: integer }
    Company:
      type: object
      required:
        [
          id,
          name,
          timezone,
          greeting,
          collectFields,
          customQuestions,
          jobberConnected,
          jobberSkipped,
          jobberNeedsReauth,
          jobberRedirectUri,
          jobberEnvironment,
          quoConnected,
          quoNeedsReauth,
          watchedNumbers,
          bookingRequiredFields,
          recentCallWindowMinutes,
          rosterCapacity,
          isLive,
          setupStatus,
          createdAt,
        ]
      properties:
        id: { type: integer }
        name: { type: string }
        timezone:
          type: string
          description: IANA zone the company schedules in. Booking times are shown and texted in this zone.
        greeting: { type: string }
        collectFields:
          type: array
          items: { type: string }
        customQuestions:
          type: array
          items:
            $ref: "#/components/schemas/CustomQuestion"
        ringThroughNumber: { type: ["string", "null"] }
        # Fallback number for owner outage/recovery texts when no ring-through
        # number is set.
        notificationNumber: { type: ["string", "null"] }
        # Raw values saved before phone validation existed that the one-time
        # cleanup pass could not normalize to a textable number. The live
        # field was cleared; these hold what was removed so settings can warn
        # the owner. Null once the owner saves a replacement.
        ringThroughNumberRejected: { type: ["string", "null"] }
        notificationNumberRejected: { type: ["string", "null"] }
        phoneNumber: { type: ["string", "null"] }
        jobberConnected: { type: boolean }
        jobberSkipped: { type: boolean }
        jobberAccountName: { type: ["string", "null"] }
        jobberNeedsReauth: { type: boolean }
        # The exact redirect URI this server will send to Jobber. Shown in
        # settings so the owner registers the string we actually use, rather
        # than one that looks right and fails at the last step.
        jobberRedirectUri: { type: string }
        # Which copy of the app served this response. Dev and production
        # share one Jobber account while Jobber rotates refresh tokens, so
        # each copy holds its own grant; "dev" lets the dashboard explain
        # that the published site owns the background sync.
        jobberEnvironment: { type: string, enum: [published, dev] }
        quoConnected: { type: boolean }
        quoWorkspaceName: { type: ["string", "null"] }
        quoKeyLast4: { type: ["string", "null"] }
        # True when Quo answered 401/403 for the stored key — the owner needs
        # to reconnect before calls flow again.
        quoNeedsReauth: { type: boolean }
        quoteRateSolo: { type: number }
        quoteRateTeam: { type: number }
        quoteFuelSurcharge: { type: number }
        quoteTaxLabel: { type: string }
        quoteTaxRate: { type: number }
        quoteFeesLabel: { type: string }
        quoteFeesRate: { type: number }
        quoteDepositAmount: { type: number }
        quoteDepositEmail: { type: ["string", "null"] }
        watchedNumbers:
          type: array
          items:
            $ref: "#/components/schemas/WatchedNumber"
        # Booking-form fields the owner has toggled back to required. Empty
        # means a booking saves with whatever the desk has, date aside.
        bookingRequiredFields:
          type: array
          items:
            type: string
            enum: [name, phone, email, address, service, time]
        # Minutes the mobile "Take booking" shortcut stays on a finished call.
        recentCallWindowMinutes: { type: integer }
        # How many roster slots (filled + open) the Team page shows. Default 20.
        rosterCapacity: { type: integer }
        isLive: { type: boolean }
        setupStatus:
          $ref: "#/components/schemas/SetupStatus"
        createdAt: { type: string }
    JobberConnection:
      type: object
      required: [id, companyId, needsReauth, createdAt]
      properties:
        id: { type: integer }
        companyId: { type: integer }
        # Owner-chosen label, e.g. "Main crew" or "Night crew".
        displayName: { type: ["string", "null"] }
        accountId: { type: ["string", "null"] }
        accountName: { type: ["string", "null"] }
        needsReauth: { type: boolean }
        createdAt: { type: string }
    JobberConnectionUpdate:
      type: object
      properties:
        # A local label only; the Jobber account name remains separate so an
        # owner can freely call an account "North crew", "Richard's iPhone",
        # or any other useful name without changing Jobber itself.
        displayName: { type: ["string", "null"], maxLength: 80 }
    JobberConnectStart:
      type: object
      required: [authorizeUrl]
      properties:
        authorizeUrl: { type: string }
    SyncResult:
      type: object
      required: [synced, skipped]
      properties:
        synced: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items: { type: string }
    ServiceInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        priceMin: { type: ["number", "null"] }
        priceMax: { type: ["number", "null"] }
        durationMinutes: { type: ["integer", "null"] }
    ServiceUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        priceMin: { type: ["number", "null"] }
        priceMax: { type: ["number", "null"] }
        durationMinutes: { type: ["integer", "null"] }
    Service:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        priceMin: { type: ["number", "null"] }
        priceMax: { type: ["number", "null"] }
        durationMinutes: { type: ["integer", "null"] }
    SuggestedServicesImportResult:
      type: object
      required: [created, services]
      properties:
        created: { type: integer }
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
    TeamMemberInput:
      type: object
      # Only the name is required. Everything else is optional because staff
      # get added mid-shift from a phone, and a half-filled card that exists is
      # worth more than a complete one nobody stopped to create.
      required: [name, role]
      properties:
        name: { type: string }
        # Optional: staff who don't use the app have no address. When present
        # it is what connects them to a login, so it also triggers the invite.
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        # Only a dispatcher or a cleaner can be invited. The owner seat is the
        # company's Clerk account and is never created through this endpoint.
        role: { type: string, enum: [dispatcher, cleaner] }
        # A label on their card, never a permission level — see TeamMember.
        isLead: { type: boolean }
        active: { type: boolean }
        # `#rrggbb`, or null to let the app pick one from their id.
        color: { type: ["string", "null"] }
        homeAddress: { type: ["string", "null"] }
        # A new roster-only staff member may be temporarily routed through one
        # of the company's Jobber accounts before they receive an app login.
        # Null means use the primary / only connection. Owner only.
        jobberConnectionId: { type: ["integer", "null"] }
    TeamMemberUpdate:
      type: object
      # Every field optional: this is a patch, and the form saves whatever the
      # owner touched without having to resend the rest of the card.
      properties:
        name: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        # `owner` is offered here so the boss can promote a second seat — his
        # own tablet or phone account — to a full owner. Only an owner may
        # send it, and nobody may demote the very card their own access rests
        # on; both are enforced on the server, not by leaving the value out of
        # this list.
        role: { type: string, enum: [owner, dispatcher, cleaner] }
        isLead: { type: boolean }
        # The owner's own wording for the job, or null to go back to the
        # standard "Cleaner"/"Dispatcher" wording. A label only — sending a
        # title never changes what this person is allowed to do.
        title: { type: ["string", "null"] }
        active: { type: boolean }
        # Hand out (or take back) live-call booking. Owner only, and only a
        # dispatcher card can carry it; moving a card off the dispatcher role
        # clears it.
        liveCallDispatching: { type: boolean }
        # `#rrggbb`, or null to go back to the automatic hue.
        color: { type: ["string", "null"] }
        homeAddress: { type: ["string", "null"] }
        # Assign (or clear) this staff member's Jobber connection. Null means
        # use the company's primary / only connection. Owner only.
        jobberConnectionId: { type: ["integer", "null"] }
    ImportTeamMembersInput:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMemberInput"
    ImportTeamMembersResult:
      type: object
      required: [added, updated, skipped, errors]
      properties:
        added: { type: integer }
        # Matched to an existing person by email, or by name when they have no
        # email — so re-uploading an edited export updates rather than clones.
        updated: { type: integer }
        skipped: { type: integer }
        # Human-readable reasons, one per row that couldn't be taken, so the
        # owner can fix the spreadsheet instead of guessing.
        errors:
          type: array
          items: { type: string }
    TeamMember:
      type: object
      required:
        [
          id,
          name,
          role,
          isLead,
          roleLabel,
          active,
          status,
          hasLogin,
          inviteEmailSent,
          blockedByOtherCompany,
          liveCallDispatching,
          jobberUserId,
          jobberConnectionId,
          createdAt,
        ]
      properties:
        id: { type: integer }
        name: { type: string }
        # Null for staff who don't sign in to the app at all.
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        role: { type: string, enum: [owner, dispatcher, cleaner] }
        # A display label, NOT a permission level: a lead cleaner sees exactly
        # what a cleaner sees. Kept apart from `role` so it can never widen
        # anyone's access by accident.
        isLead: { type: boolean }
        # The owner's own wording for this job — "Site Supervisor", "Window
        # Tech". Null means the standard wording. Like `isLead` it is a label
        # and NOT a permission level; `role` alone decides what someone may do.
        title: { type: ["string", "null"] }
        # What to actually print on screen: the custom title when there is one,
        # otherwise the standard wording for role + isLead. Computed server
        # side so the roster, the map and the tracking page can't disagree.
        roleLabel: { type: string }
        # On the roster. Inactive staff keep their history and their login,
        # they just stop appearing where work gets assigned.
        active: { type: boolean }
        # Whether this seat may take a booking off a live call. Only means
        # anything on a dispatcher card — the server requires role AND flag —
        # and only the owner can switch it.
        liveCallDispatching: { type: boolean }
        # The colour this person's work is drawn in, as `#rrggbb`. Null means
        # the app picks one from their id, so a card always has a colour even
        # when nobody chose it.
        color: { type: ["string", "null"] }
        homeAddress: { type: ["string", "null"] }
        homeLat: { type: ["number", "null"] }
        homeLng: { type: ["number", "null"] }
        # pending — they signed up with the join code and are waiting to be let
        # in. A pending seat can reach nothing until it is approved.
        status: { type: string, enum: [active, invited, pending] }
        # True once this person has signed up and their verified email was
        # matched to this seat, i.e. they can actually sign in.
        hasLogin: { type: boolean }
        # False when Clerk would not send the sign-up email. The seat still
        # works — they just have to sign up with the invited address manually.
        inviteEmailSent: { type: boolean }
        # True when this invite can never be accepted: the address is already
        # attached to another company, and a login can only belong to one.
        blockedByOtherCompany: { type: boolean }
        claimedAt: { type: ["string", "null"] }
        # The Jobber user this staff member is linked to, or null when
        # unlinked. Identity only — assignment sync keys on it in both
        # directions; nothing else about the person syncs through it.
        jobberUserId: { type: ["string", "null"] }
        # Which Jobber connection (account) this staff member is assigned to.
        # Null means "use the company's primary / only connection". Set by the
        # owner when the company has more than one Jobber account connected.
        jobberConnectionId: { type: ["integer", "null"] }
        createdAt: { type: string }
    JobberTeamMember:
      type: object
      required:
        [jobberUserId, name, linkedTeamMemberId, suggestedTeamMemberId, gone]
      properties:
        jobberUserId: { type: string }
        # The name as Jobber has it right now — shown so the owner can tell
        # who this is even when the roster spells them differently. For a
        # gone entry Jobber no longer reports a name, so this is the roster
        # member's own name instead.
        name: { type: string }
        # True when this entry exists only because a roster member's stored
        # link points at a Jobber user missing from Jobber's active list —
        # deactivated or deleted there. Assignment sync for that seat has
        # stopped; the owner should unlink (and relink if they return).
        gone: { type: boolean }
        # The staff member currently linked to this Jobber user, or null.
        linkedTeamMemberId: { type: ["integer", "null"] }
        # When unlinked: the staff member the calendar sync's own name
        # matching would pick, or null when nobody matches or the name is
        # ambiguous. Computed with the exact matcher the sync uses, so this
        # preview can never disagree with what a sync would do.
        suggestedTeamMemberId: { type: ["integer", "null"] }
    JobberTeamMembersResult:
      type: object
      required: [members, failedConnections]
      properties:
        # Users returned by the connections that were reachable. When
        # failedConnections is non-empty this is context only, not a complete
        # roster that can be used for link changes.
        members:
          type: array
          items:
            $ref: "#/components/schemas/JobberTeamMember"
        # A non-empty list means the response is incomplete. Absence from the
        # available members must not be treated as a deactivated Jobber user.
        failedConnections:
          type: array
          items:
            $ref: "#/components/schemas/JobberConnectionFailure"
    JobberConnectionFailure:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    LinkJobberUserInput:
      type: object
      required: [jobberUserId]
      properties:
        jobberUserId: { type: string, minLength: 1, maxLength: 200 }
    ImportJobberUserInput:
      type: object
      required: [jobberUserId]
      properties:
        jobberUserId: { type: string, minLength: 1, maxLength: 200 }
    CrewMember:
      type: object
      required: [id, name, role]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string, enum: [owner, dispatcher, cleaner] }
    SetBookingCrewInput:
      type: object
      required: [teamMemberIds]
      properties:
        # The complete crew for the job — this replaces whoever was on it.
        # An empty list unassigns everyone.
        teamMemberIds:
          type: array
          maxItems: 20
          items: { type: integer }
    JoinCode:
      type: object
      required: [joinCode]
      properties:
        joinCode: { type: string }
    JoinRequestInput:
      type: object
      required: [joinCode, name]
      properties:
        joinCode: { type: string }
        name: { type: string }
        phone: { type: ["string", "null"] }
        # What they say they do. The approver picks the real role, so this is
        # a hint on the request card and never an access decision.
        role: { type: string, enum: [dispatcher, cleaner] }
    JoinRequestResult:
      type: object
      required: [ok, companyName]
      properties:
        ok: { type: boolean }
        # Empty when there is nothing left to wait for.
        companyName: { type: string }
    ApproveTeamMemberInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [dispatcher, cleaner] }
        isLead: { type: boolean }
    CurrentUser:
      type: object
      required:
        [role, name, email, companyName, canCreateCompany, canTakeLiveCalls]
      properties:
        # Which seat the signed-in account holds. Drives what the dashboard
        # shows and what the API will let them do.
        role: { type: string, enum: [owner, dispatcher, cleaner] }
        # The team_members row backing this session. Null for the owner, whose
        # access comes from owning the company rather than holding a seat.
        teamMemberId: { type: ["integer", "null"] }
        name: { type: string }
        email: { type: string }
        companyName: { type: string }
        # Set when this account has asked to join a company and is waiting to
        # be approved. Empty otherwise. While it is set the account holds no
        # access at all, so the app shows a waiting screen rather than the
        # "create your company" wizard.
        pendingCompanyName: { type: string }
        # False on a site that has been closed to new companies — one
        # company's own address, where a stranger may only join with a code.
        # Staff signup is unaffected; this hides the create-a-company wizard.
        canCreateCompany: { type: boolean }
        # Whether this account may take a booking off a live call — the
        # incoming-call alert, the microphone panel, and the two routes that
        # fill the booking form. True for the owner, and for a dispatcher
        # whose staff card has the live-call dispatching switch on.
        canTakeLiveCalls: { type: boolean }
    TranscriptSegment:
      type: object
      required: [speaker, text, offsetSeconds]
      properties:
        speaker: { type: string, enum: [caller, ai] }
        text: { type: string }
        offsetSeconds: { type: number }
    ExtractedAnswer:
      type: object
      required: [field, value]
      properties:
        field: { type: string }
        value: { type: string }
    Call:
      type: object
      required:
        [
          id,
          callerName,
          callerPhone,
          status,
          startedAt,
          durationSeconds,
          isTest,
        ]
      properties:
        id: { type: integer }
        callerName: { type: string }
        callerPhone: { type: string }
        status: { type: string, enum: [in_progress, completed, missed, booked] }
        serviceRequested: { type: ["string", "null"] }
        preferredTime: { type: ["string", "null"] }
        startedAt: { type: string }
        durationSeconds: { type: integer }
        isTest: { type: boolean }
        bookingId: { type: ["integer", "null"] }
        direction: { type: ["string", "null"] }
        summary: { type: ["string", "null"] }
        quoCallId: { type: ["string", "null"] }
        recordingUrl: { type: ["string", "null"] }
        # The owner's quick verdict after the call. Null until tagged.
        tag:
          type: ["string", "null"]
          enum: [client, good_lead, bad_lead, spam, null]
    CallDetail:
      type: object
      required:
        [
          id,
          callerName,
          callerPhone,
          status,
          startedAt,
          durationSeconds,
          isTest,
          transcript,
          extractedAnswers,
        ]
      properties:
        id: { type: integer }
        callerName: { type: string }
        callerPhone: { type: string }
        status: { type: string, enum: [in_progress, completed, missed, booked] }
        serviceRequested: { type: ["string", "null"] }
        preferredTime: { type: ["string", "null"] }
        startedAt: { type: string }
        durationSeconds: { type: integer }
        isTest: { type: boolean }
        bookingId: { type: ["integer", "null"] }
        direction: { type: ["string", "null"] }
        summary: { type: ["string", "null"] }
        quoCallId: { type: ["string", "null"] }
        recordingUrl: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        # The owner's quick verdict after the call. Null until tagged.
        tag:
          type: ["string", "null"]
          enum: [client, good_lead, bad_lead, spam, null]
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegment"
        extractedAnswers:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedAnswer"
    DraftBookingFromTextInput:
      type: object
      required: [text]
      properties:
        # Capped because this is a running microphone transcript, and a
        # forgotten open mic would otherwise post an ever-growing body.
        text: { type: string, minLength: 1, maxLength: 20000 }
    UpdateCallNotesInput:
      type: object
      required: [notes]
      properties:
        # Empty string clears the pad. Capped so a stray paste can't balloon
        # the row.
        notes: { type: string, maxLength: 20000 }
    TagUpdateInput:
      type: object
      required: [tag]
      properties:
        # The owner's quick verdict; null clears the tag. One tag at a time —
        # this is a fast triage marker, not a labeling system.
        tag:
          type: ["string", "null"]
          enum: [client, good_lead, bad_lead, spam, null]
    BookingDraft:
      type: object
      # A suggestion, never a saved booking. Every field is nullable because
      # a caller who mumbles their address simply leaves that box empty for
      # the dispatcher to fill in.
      required: [callId, filledFields]
      properties:
        # Null when the draft came from the dispatcher's microphone rather
        # than from a call Quo transcribed.
        callId: { type: ["integer", "null"] }
        customerName: { type: ["string", "null"] }
        customerPhone: { type: ["string", "null"] }
        customerAddress: { type: ["string", "null"] }
        addressLine2: { type: ["string", "null"], maxLength: 120 }
        addressCity: { type: ["string", "null"] }
        addressProvince: { type: ["string", "null"] }
        addressPostal: { type: ["string", "null"] }
        service: { type: ["string", "null"] }
        bedrooms: { type: ["integer", "null"] }
        bathrooms: { type: ["integer", "null"] }
        # What the caller said about timing, in their words ("next Tuesday").
        # Deliberately not a date: guessing one and being wrong is worse than
        # showing the dispatcher the phrase and letting them pick.
        preferredTime: { type: ["string", "null"] }
        internalNotes: { type: ["string", "null"] }
        # Which of the above we actually found something for, so the form can
        # highlight the boxes it filled instead of the dispatcher hunting.
        filledFields:
          type: array
          items: { type: string }
    StartStaffConversationInput:
      type: object
      required: [memberIds]
      properties:
        memberIds:
          type: array
          items: { type: integer }
        # Groups only; a direct chat is titled by the other person's name.
        # Capped because the title rides along in every notification text.
        title: { type: ["string", "null"], maxLength: 60 }
    SendStaffMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    StaffConversation:
      type: object
      required:
        [id, kind, title, memberNames, members, lastMessageAt, unreadCount]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [direct, group] }
        title: { type: string }
        memberNames:
          type: array
          items: { type: string }
        # The other people in the thread, with whether each one is out working
        # right now — their phone reported a position in the last few minutes,
        # the same signal that draws a bright car on the map.
        members:
          type: array
          items:
            $ref: "#/components/schemas/StaffChatMember"
        lastMessageAt: { type: string }
        lastMessagePreview: { type: ["string", "null"] }
        unreadCount: { type: integer }
    StaffChatMember:
      type: object
      required: [id, name, isLive]
      properties:
        id: { type: integer }
        name: { type: string }
        isLive: { type: boolean }
    StaffMessage:
      type: object
      required: [id, memberId, authorName, body, createdAt]
      properties:
        id: { type: integer }
        # The staff card that wrote it, so the app can tell "mine" from theirs.
        memberId: { type: integer }
        authorName: { type: string }
        body: { type: string }
        createdAt: { type: string }
    ChatContact:
      type: object
      required: [id, name, role, isLead, isLive]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
        isLead: { type: boolean }
        # Out working right now — phone reported a position in the last few
        # minutes, same rule as the map's bright cars.
        isLive: { type: boolean }
    StartThreadInput:
      type: object
      required: [phone]
      properties:
        phone: { type: string }
        name: { type: ["string", "null"] }
    SendMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1600 }
    MessageThread:
      type: object
      required: [id, customerPhone, customerName, lastMessageAt, unreadCount]
      properties:
        id: { type: integer }
        customerPhone: { type: string }
        # Copied from a booking or call when known; null for a stranger, which
        # the inbox shows as the number rather than inventing a name.
        customerName: { type: ["string", "null"] }
        lastMessageAt: { type: string }
        lastMessagePreview: { type: ["string", "null"] }
        lastDirection: { type: ["string", "null"] }
        unreadCount: { type: integer }
    ClientMessage:
      type: object
      required: [id, direction, body, status, createdAt]
      properties:
        id: { type: integer }
        direction: { type: string, enum: [inbound, outbound] }
        body: { type: string }
        status: { type: string, enum: [received, sent, failed] }
        # Why a send failed, in words a dispatcher can act on.
        errorText: { type: ["string", "null"] }
        # Who on the team sent it; null for inbound and automatic texts.
        sentByName: { type: ["string", "null"] }
        createdAt: { type: string }
    Booking:
      type: object
      required:
        [
          id,
          customerName,
          customerPhone,
          service,
          scheduledFor,
          status,
          quoteTotals,
          jobberSynced,
          jobberAutomaticRetryStatus,
          jobberAutomaticRetriesRemaining,
          jobberNextRetryAt,
          jobberRetryUsesBookingConnection,
          needsTimeReview,
          createdAt,
        ]
      properties:
        id: { type: integer }
        callId: { type: ["integer", "null"] }
        customerName: { type: string }
        customerPhone: { type: string }
        tag:
          type: ["string", "null"]
          enum: [client, good_lead, bad_lead, spam, null]
        customerEmail: { type: ["string", "null"] }
        # Street line only — city/province/postal are separate, because the
        # booking desk types them into separate boxes and Jobber wants them
        # apart. Older bookings have the whole address in this one field.
        customerAddress: { type: ["string", "null"] }
        addressLine2: { type: ["string", "null"], maxLength: 120 }
        addressCity: { type: ["string", "null"] }
        addressProvince: { type: ["string", "null"] }
        addressPostal: { type: ["string", "null"] }
        service: { type: string }
        # Job scope as walked through on the phone. All optional.
        bedrooms: { type: ["integer", "null"] }
        bathrooms: { type: ["integer", "null"] }
        extras:
          oneOf:
            - type: array
              items: { type: string }
            - type: "null"
        # one_time | weekly | biweekly | monthly — what the customer asked
        # for. Recurring visits themselves live in Jobber, not here.
        frequency: { type: ["string", "null"] }
        # Gate codes, dogs, where the key is. Never shown to the customer.
        internalNotes: { type: ["string", "null"] }
        scheduledFor: { type: string }
        status:
          { type: string, enum: [pending, confirmed, completed, canceled] }
        # How the job was priced: hours x crew rate, plus fuel, less any promo.
        quoteHours: { type: ["number", "null"] }
        quoteCrewLabel: { type: ["string", "null"] }
        quoteHourlyRate: { type: ["number", "null"] }
        quoteFuelSurcharge: { type: ["number", "null"] }
        quoteDiscountAmount: { type: ["number", "null"] }
        quoteReferralSource: { type: ["string", "null"] }
        # Flat subtotal for a job priced without the calculator. Before the
        # company's tax and fees, not the customer-facing total.
        quotedAmount: { type: ["number", "null"] }
        quoteDeposit: { type: ["number", "null"] }
        quoteNotes: { type: ["string", "null"] }
        quoteMessage: { type: ["string", "null"] }
        quoteSentAt: { type: ["string", "null"] }
        # Where the customer views their quote. Null until a quote is sent.
        quoteUrl: { type: ["string", "null"] }
        # The customer's own tap on their quote link.
        quoteApprovedAt: { type: ["string", "null"] }
        # The office recording that the client said yes — usually on the phone.
        # Either of these two means the client confirmed; the booking's status
        # says "Confirmed" for no other reason.
        clientApprovedAt: { type: ["string", "null"] }
        # Who recorded it, kept as a name so it survives them leaving.
        clientApprovedBy: { type: ["string", "null"] }
        depositPaidAt: { type: ["string", "null"] }
        depositPaidAmount: { type: ["number", "null"] }
        # Derived from those inputs and the company's rates, never stored, so a
        # rate change can't leave a quote disagreeing with itself. Null for
        # cleaner callers: pricing never leaves the server for a crew login.
        quoteTotals:
          oneOf:
            - $ref: "#/components/schemas/QuoteTotals"
            - type: "null"
        # What the customer was actually promised, frozen when the text went
        # out. Null until a quote has been sent.
        quoteSentTotals:
          oneOf:
            - $ref: "#/components/schemas/QuoteTotals"
            - type: "null"
        # True when a company timezone change shifted this booking's displayed
        # time and the owner hasn't yet confirmed or adjusted it.
        needsTimeReview: { type: boolean }
        # The zone the booking was shown in before the switch, e.g.
        # "America/Edmonton". Null unless flagged for review.
        timeReviewPreviousTimezone: { type: ["string", "null"] }
        jobberSynced: { type: boolean }
        jobberJobId: { type: ["string", "null"] }
        jobberClientId: { type: ["string", "null"] }
        jobberWebUri: { type: ["string", "null"] }
        # Set once the owner has created a Jobber invoice from this booking.
        # Presence means "already invoiced".
        jobberInvoiceId: { type: ["string", "null"] }
        jobberInvoiceNumber: { type: ["string", "null"] }
        # Jobber's own page for that invoice, captured when it was created.
        # Null for invoices made before this was stored — the app then falls
        # back to the booking's job page.
        jobberInvoiceWebUri: { type: ["string", "null"] }
        jobberSyncError: { type: ["string", "null"] }
        jobberSyncErrorAt: { type: ["string", "null"] }
        # Derived from the persisted sync error, attempt count, and the same
        # backoff used by the automatic retry worker. Null for cleaners.
        jobberAutomaticRetryStatus:
          type: ["string", "null"]
          enum: [none, pending, exhausted, manual, null]
        jobberAutomaticRetriesRemaining: { type: ["integer", "null"] }
        jobberNextRetryAt: { type: ["string", "null"] }
        # True when this booking's retry belongs to a specific secondary
        # Jobber account rather than the company's primary account.
        # Null for cleaners.
        jobberRetryUsesBookingConnection: { type: ["boolean", "null"] }
        # The Jobber property the request was filed under. Plumbing for the
        # push; surfaced so a support eye can spot a wrong-property mixup.
        jobberPropertyId: { type: ["string", "null"] }
        # Set once a quote raised here was pushed into Jobber. The number and
        # web link are what the office actually clicks; null for bookings
        # synced before quotes went over, or when no quote was sent.
        jobberQuoteId: { type: ["string", "null"] }
        jobberQuoteNumber: { type: ["string", "null"] }
        jobberQuoteWebUri: { type: ["string", "null"] }
        # Jobber's last mirrored status for this quote. This is deliberately
        # separate from clientApprovedAt/quoteApprovedAt: approval may have
        # happened in Jobber rather than in Book My Cleaning.
        jobberQuoteStatus: { type: ["string", "null"] }
        # Set when this booking was imported from a Jobber request (pull sync).
        # Null for bookings created here or imported from a Jobber quote.
        jobberSyncedRequestId: { type: ["string", "null"] }
        # Set when this booking was imported from a Jobber quote (pull sync).
        # Null for bookings created here or imported from a Jobber request.
        jobberSyncedQuoteId: { type: ["string", "null"] }
        # The job this app scheduled into Jobber from the approved quote, and
        # Jobber's own page for it. Null until explicit scheduling is used —
        # a booking imported *from* Jobber has these empty, because Jobber
        # made that job, not us.
        jobberCreatedJobId: { type: ["string", "null"] }
        jobberJobWebUri: { type: ["string", "null"] }
        # Geocoded position of the job's address, for the live dispatch map.
        # Null until the address is resolved.
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        geocodedAt: { type: ["string", "null"] }
        # True only after the background geocoder tried this address and got
        # no result. False/omitted means the address is still pending or
        # already has a usable pin.
        geocodingFailed: { type: boolean }
        # Expected job length in minutes, for laying it out on the schedule.
        durationMinutes: { type: ["integer", "null"] }
        # The cleaners working this job. Empty until a crew is assigned.
        crew:
          type: array
          items: { $ref: "#/components/schemas/CrewMember" }
        # On-site time, clocked by whoever is at the house. `timerRunningSince`
        # is the moment the current stretch started, null when the clock is
        # stopped; `workedMinutes` counts only finished stretches, so the two
        # together describe the job without the server having to guess "now".
        timerRunningSince: { type: ["string", "null"] }
        workedMinutes: { type: integer }
        timeEntries:
          type: array
          items: { $ref: "#/components/schemas/BookingTimeEntry" }
        createdAt: { type: string }
    BookingTimeEntry:
      type: object
      required: [id, startedAt, endedAt, minutes]
      properties:
        id: { type: integer }
        startedAt: { type: string }
        # Null while this stretch is still running.
        endedAt: { type: ["string", "null"] }
        # Whole minutes worked in this stretch; 0 while it is still running.
        minutes: { type: integer }
        # Who clocked in, if we know. Kept as a name rather than an id so a
        # cleaner who has since left the team still shows on the history.
        startedByName: { type: ["string", "null"] }
        # True when the office corrected these times by hand.
        edited: { type: boolean }
        # Where the stretch was clocked: this app, or Jobber's own timer.
        source: { type: string, enum: [app, jobber] }
    BookingUpdate:
      type: object
      properties:
        status:
          { type: string, enum: [pending, confirmed, completed, canceled] }
        scheduledFor: { type: string }
        # Blank allowed on all three: the owner can make fields optional, so
        # an edit must be able to save what a lighter form sent. Displays
        # fall back to the phone number or "No name".
        customerName: { type: string }
        customerPhone: { type: string }
        customerEmail: { type: ["string", "null"] }
        customerAddress: { type: ["string", "null"] }
        addressLine2: { type: ["string", "null"], maxLength: 120 }
        addressCity: { type: ["string", "null"], maxLength: 120 }
        addressProvince: { type: ["string", "null"], maxLength: 60 }
        addressPostal: { type: ["string", "null"], maxLength: 20 }
        service: { type: string }
        bedrooms: { type: ["integer", "null"], minimum: 0, maximum: 50 }
        bathrooms: { type: ["integer", "null"], minimum: 0, maximum: 50 }
        extras:
          oneOf:
            - type: array
              items: { type: string, minLength: 1, maxLength: 60 }
              maxItems: 30
            - type: "null"
        frequency:
          oneOf:
            - type: string
              enum: [one_time, weekly, biweekly, monthly]
            - type: "null"
        internalNotes: { type: ["string", "null"], maxLength: 4000 }
        # Bounded so a typo can't produce a nonsense quote: a cleaning job is
        # not 5000 hours long, and no crew costs $1m an hour.
        quoteHours: { type: ["number", "null"], minimum: 0, maximum: 24 }
        quoteCrewLabel: { type: ["string", "null"], maxLength: 60 }
        quoteHourlyRate:
          { type: ["number", "null"], minimum: 0, maximum: 10000 }
        quoteFuelSurcharge:
          { type: ["number", "null"], minimum: 0, maximum: 10000 }
        quoteDiscountAmount:
          { type: ["number", "null"], minimum: 0, maximum: 100000 }
        quoteReferralSource: { type: ["string", "null"], maxLength: 60 }
        quotedAmount: { type: ["number", "null"], minimum: 0, maximum: 1000000 }
        quoteDeposit: { type: ["number", "null"], minimum: 0, maximum: 1000000 }
        quoteNotes: { type: ["string", "null"] }
    BookingCreate:
      type: object
      # A time, and that is all the contract demands. The booking desk takes
      # these while the customer is still talking, and a caller who hangs up
      # after leaving only a phone number still has to end up in here — a
      # booking with a gap in it beats a booking on a sticky note. Which
      # fields beyond the date are mandatory is the owner's call, enforced by
      # the route against the company's bookingRequiredFields setting.
      required: [scheduledFor]
      properties:
        # May be blank: everything that shows a booking falls back to the
        # phone number, or a plain "No name".
        customerName: { type: string }
        # May be blank: someone calling from a blocked number, or a walk-in.
        # Anything that needs to text them checks for a real number first.
        customerPhone: { type: string }
        customerEmail: { type: ["string", "null"] }
        customerAddress: { type: ["string", "null"] }
        addressLine2: { type: ["string", "null"], maxLength: 120 }
        addressCity: { type: ["string", "null"], maxLength: 120 }
        addressProvince: { type: ["string", "null"], maxLength: 60 }
        addressPostal: { type: ["string", "null"], maxLength: 20 }
        # May be blank while the caller is still deciding. Everything that
        # prints or sends the service falls back to a plain "Cleaning".
        service: { type: string }
        bedrooms: { type: ["integer", "null"], minimum: 0, maximum: 50 }
        bathrooms: { type: ["integer", "null"], minimum: 0, maximum: 50 }
        extras:
          oneOf:
            - type: array
              items: { type: string, minLength: 1, maxLength: 60 }
              maxItems: 30
            - type: "null"
        frequency:
          oneOf:
            - type: string
              enum: [one_time, weekly, biweekly, monthly]
            - type: "null"
        internalNotes: { type: ["string", "null"], maxLength: 4000 }
        # The lead this booking was worked from, when the desk opened it out of
        # the Leads inbox. Sent at creation rather than left to the follow-up
        # convert call, because the booking is on its way to Jobber before that
        # call lands — and a lead has to reach Jobber as a new client, never
        # matched onto an existing one. Must be a lead in this company's inbox.
        leadId: { type: ["integer", "null"] }
        # When created from a saved-route stop, the booking inherits that
        # route's cleaner. The route and stop must belong to this company.
        routeStopId: { type: ["integer", "null"] }
        # Who should work it, chosen while the customer is still on the phone.
        # Same rule as the crew picker: this company's active people only.
        teamMemberIds:
          oneOf:
            - type: array
              items: { type: integer }
              maxItems: 20
            - type: "null"
        scheduledFor: { type: string }
        # No status here on purpose. A new booking is always pending:
        # "confirmed" means the client said yes, and nobody can type that in.
        quoteHours: { type: ["number", "null"], minimum: 0, maximum: 24 }
        quoteCrewLabel: { type: ["string", "null"], maxLength: 60 }
        quoteHourlyRate:
          { type: ["number", "null"], minimum: 0, maximum: 10000 }
        quoteFuelSurcharge:
          { type: ["number", "null"], minimum: 0, maximum: 10000 }
        quoteDiscountAmount:
          { type: ["number", "null"], minimum: 0, maximum: 100000 }
        quoteReferralSource: { type: ["string", "null"], maxLength: 60 }
        quotedAmount: { type: ["number", "null"], minimum: 0, maximum: 1000000 }
        quoteDeposit: { type: ["number", "null"], minimum: 0, maximum: 1000000 }
        quoteNotes: { type: ["string", "null"] }
    ApproveBookingInput:
      type: object
      properties:
        # False records local approval without contacting Jobber. True only
        # schedules a quote already approved locally, through the public quote
        # link, or in mirrored Jobber status; it never records approval.
        schedule: { type: boolean, default: false }
    ApproveBookingResult:
      type: object
      required: [booking, recorded, scheduledInJobber, unmatchedCrew]
      properties:
        booking: { $ref: "#/components/schemas/Booking" }
        # True only when this request created a local Book My Cleaning approval
        # record. False for scheduling and for an approval already on record.
        recorded: { type: boolean }
        scheduledInJobber: { type: boolean }
        # Cleaners with no confident Jobber user. The visit went out without
        # them; saying so is the point.
        unmatchedCrew:
          type: array
          items: { type: string }
        # What Jobber refused, if anything. The pre-existing approval and its
        # original provenance are unchanged.
        jobberError: { type: ["string", "null"] }
    QuoteLineItem:
      type: object
      required: [name, quantity, unitPrice]
      properties:
        name: { type: string, minLength: 1 }
        # Usually hours.
        quantity: { type: number }
        # Negative for a discount line, so no minimum.
        unitPrice: { type: number }
    QuoteTotals:
      type: object
      required:
        [
          lineItems,
          subtotal,
          taxLabel,
          taxRate,
          taxAmount,
          feesLabel,
          feesRate,
          feesAmount,
          total,
          deposit,
        ]
      properties:
        # Rebuilt from the pricing inputs; these are the rows on the estimate.
        lineItems:
          type: array
          items: { $ref: "#/components/schemas/QuoteLineItem" }
        subtotal: { type: number }
        taxLabel: { type: string }
        taxRate: { type: number }
        taxAmount: { type: number }
        feesLabel: { type: string }
        feesRate: { type: number }
        feesAmount: { type: number }
        total: { type: number }
        deposit: { type: number }
        depositEmail: { type: ["string", "null"] }
    # What a customer sees at their quote link. Deliberately narrow: this is
    # served without authentication, so it carries only what belongs on the
    # customer's own estimate and nothing else about the company or its jobs.
    PublicQuote:
      type: object
      required:
        [
          companyName,
          customerName,
          service,
          scheduledForLabel,
          totals,
          approved,
        ]
      properties:
        companyName: { type: string }
        customerName: { type: string }
        customerAddress: { type: ["string", "null"] }
        service: { type: string }
        # The company's own description of this service, if they've written one.
        serviceDescription: { type: ["string", "null"] }
        # Preformatted in the company's timezone — the customer must see the
        # same hour the dispatcher does, not their own device's timezone.
        scheduledForLabel: { type: string }
        totals: { $ref: "#/components/schemas/QuoteTotals" }
        notes: { type: ["string", "null"] }
        sentAtLabel: { type: ["string", "null"] }
        approved: { type: boolean }
        approvedAtLabel: { type: ["string", "null"] }
        # True only once Stripe confirms the money cleared — never on the
        # redirect back from Checkout, which the customer controls.
        depositPaid: { type: boolean }
        depositPaidAmount: { type: ["number", "null"] }
        depositPaidAtLabel: { type: ["string", "null"] }
        # What's still chargeable online, or null when nothing is owed.
        payableAmount: { type: ["number", "null"] }
    QuotePreview:
      type: object
      required: [message, canSend]
      properties:
        message: { type: string }
        # False when the company has no Quo line to send from, or no key.
        canSend: { type: boolean }
        blockedReason: { type: ["string", "null"] }
        fromNumber: { type: ["string", "null"] }
        totals: { $ref: "#/components/schemas/QuoteTotals" }
    RescheduleTextPreview:
      type: object
      required: [message, canSend]
      properties:
        message: { type: string }
        # False when the customer's number can't be texted, or the company
        # has no Quo line / key to send from.
        canSend: { type: boolean }
        blockedReason: { type: ["string", "null"] }
    SendRescheduleTextInput:
      type: object
      properties:
        # The dispatcher's edited copy of the draft. Omitted or blank means
        # "send the server's own draft".
        message: { type: string, minLength: 1, maxLength: 1600 }
    SendQuoteInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 1600 }
        # The edited message no longer contains the calculated price, and the
        # dispatcher has explicitly confirmed they mean to send it anyway.
        # Without this, such a send is refused so the booking's frozen quote
        # can't silently disagree with what the customer was texted.
        confirmPriceMismatch: { type: boolean }
    JobberSkipInput:
      type: object
      required: [skipped]
      properties:
        skipped: { type: boolean }
    DashboardSummary:
      type: object
      required:
        [
          callsToday,
          callsThisWeek,
          bookingsThisWeek,
          answeredRate,
          avgCallSeconds,
          pendingBookings,
          jobberSyncedCount,
          upcomingBookings,
          completedThisMonth,
          totalBookings,
          bookingsThisMonth,
          canceledBookings,
          revenueThisMonth,
          newLeads,
        ]
      properties:
        callsToday: { type: integer }
        callsThisWeek: { type: integer }
        bookingsThisWeek: { type: integer }
        answeredRate: { type: number }
        avgCallSeconds: { type: integer }
        pendingBookings: { type: integer }
        jobberSyncedCount: { type: integer }
        # Jobs still ahead of us: scheduled from now on, pending or confirmed.
        upcomingBookings: { type: integer }
        # Jobs marked done whose visit fell in the current calendar month
        # (company timezone).
        completedThisMonth: { type: integer }
        totalBookings: { type: integer }
        # Bookings created this calendar month (company timezone) — same
        # "created" semantics as bookingsThisWeek.
        bookingsThisMonth: { type: integer }
        canceledBookings: { type: integer }
        # Sum of quoted totals for jobs completed this month, in dollars.
        # Null for cleaners: crew see counts, never money.
        revenueThisMonth: { type: number, nullable: true }
        # Sheet-synced leads still waiting for review on the Leads page.
        newLeads: { type: integer }
    Lead:
      type: object
      required:
        [
          id,
          externalId,
          source,
          sourceTab,
          status,
          name,
          phoneDisplay,
          jobberSynced,
          hasCalled,
          createdAt,
        ]
      properties:
        id: { type: integer }
        # The id that makes imports idempotent, per source: the sheet's own
        # unique lead id for sheet rows, a random token for form submissions.
        externalId: { type: string }
        # Where the lead came from: the ad-sheet sync, our own request form,
        # a request submitted on the company's Jobber form, or saved from a
        # phone call by the dispatcher with one tap.
        source: { type: string, enum: [sheet, form, jobber, call] }
        # Which sheet tab the row came from, or a fixed label for form and
        # Jobber leads.
        sourceTab: { type: string }
        # new | converted | dismissed — the dispatcher's review state.
        status: { type: string, enum: [new, converted, dismissed] }
        # First + last name joined; empty string when the sheet had neither.
        name: { type: string }
        # The raw phone as typed into the ad, for display.
        phoneDisplay: { type: string }
        # Normalized E.164 for dialing/matching; null when undialable.
        phoneE164: { type: string, nullable: true }
        # True when at least one call in the company's history came from this
        # lead's phone number (both sides normalized to E.164). The server
        # decides this so web and mobile can never disagree; a lead with no
        # dialable number is always false.
        hasCalled: { type: boolean }
        # When the most recent matching call happened (ISO). Null when
        # hasCalled is false.
        lastCallAt: { type: string, nullable: true }
        # The id of the most recent matching call (for navigating straight to
        # its transcript/recording). Null when hasCalled is false.
        lastCallId: { type: integer, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        # All raw sheet text, verbatim — including free-text answers like
        # "1 or 2" bedrooms and a requested date that is NOT a parsed date.
        service: { type: string, nullable: true }
        bedrooms: { type: string, nullable: true }
        bathrooms: { type: string, nullable: true }
        dateOfServiceRequested: { type: string, nullable: true }
        streetAddress: { type: string, nullable: true }
        city: { type: string, nullable: true }
        province: { type: string, nullable: true }
        postCode: { type: string, nullable: true }
        platform: { type: string, nullable: true }
        campaignName: { type: string, nullable: true }
        adName: { type: string, nullable: true }
        formName: { type: string, nullable: true }
        inboxUrl: { type: string, nullable: true }
        # The sheet's own lead_status column, raw (never written back).
        sheetLeadStatus: { type: string, nullable: true }
        # "How did you hear about us?" — form leads only, verbatim.
        heardAbout: { type: string, nullable: true }
        # The customer's own message from a Jobber request, verbatim — their
        # words, never parsed into a scheduled time.
        message: { type: string, nullable: true }
        # When the lead was submitted, as the sheet recorded it (raw text).
        createdTime: { type: string, nullable: true }
        # Map pin, resolved from the raw sheet address by the background
        # geocoder. Null while still locating or when the address is unusable.
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        # True only after the background geocoder tried this address and got
        # no result. False/omitted means the address is still pending or
        # already has a usable pin.
        geocodingFailed: { type: boolean }
        # The booking this lead became, once converted.
        convertedBookingId: { type: integer, nullable: true }
        convertedAt: { type: string, nullable: true }
        # ---- The Jobber records tied to this lead. ----
        # Direction is told by `source`, never by these fields: a "jobber"
        # lead links to the request it was imported from, a "form" lead to
        # the client + work request OUR push created. jobberSynced is true
        # only for pushed form leads; sheet leads always carry false.
        jobberSynced: { type: boolean }
        # Jobber's own page for the lead's work request, whichever way it
        # travelled. Null for sheet leads and unpushed form leads.
        jobberWebUri: { type: string, nullable: true }
        # Why the last push failed, verbatim; null after a clean push.
        jobberPushError: { type: string, nullable: true }
        jobberPushErrorAt: { type: string, nullable: true }
        # When the sync imported the row (ISO).
        createdAt: { type: string }
        # The call that was saved as this lead (save-as-lead flow). Set only
        # for leads with source="call"; null for every other source. Lets the
        # card link straight to the original transcript/recording without
        # relying on the phone-number match that powers lastCallId.
        callId: { type: integer, nullable: true }
        # The owner's quick verdict: client | good_lead | bad_lead | spam.
        # Null until tagged; independent of the review `status`.
        tag:
          type: ["string", "null"]
          enum: [client, good_lead, bad_lead, spam, null]
    BulkDismissLeadsInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer }
          minItems: 1
    BulkDismissLeadsResult:
      type: object
      required: [dismissed, skipped]
      properties:
        # How many leads were moved to "dismissed".
        dismissed: { type: integer }
        # How many were skipped because they were already converted.
        skipped: { type: integer }
    ConvertLeadInput:
      type: object
      required: [bookingId]
      properties:
        # The booking created from this lead.
        bookingId: { type: integer }
    LeadContactUpdateInput:
      type: object
      properties:
        # Raw phone as typed; server normalizes to E.164.
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
    PublicRequestInput:
      type: object
      required: [phone]
      properties:
        # Stored verbatim: whatever the customer types is what the office
        # sees. The only derived value is the normalized E.164 phone, and the
        # preferred date is free text that is never parsed into a real time.
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        # The one genuinely required field — a lead the office can't call
        # back isn't a lead.
        phone: { type: string, minLength: 1, maxLength: 40 }
        email: { type: string, maxLength: 200 }
        streetAddress: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        province: { type: string, maxLength: 100 }
        postCode: { type: string, maxLength: 20 }
        service: { type: string, maxLength: 200 }
        bedrooms: { type: string, maxLength: 50 }
        bathrooms: { type: string, maxLength: 50 }
        dateOfServiceRequested: { type: string, maxLength: 200 }
        heardAbout: { type: string, maxLength: 200 }
        # Honeypot. The real form renders this hidden and never fills it;
        # bots that fill every field out themselves.
        website: { type: string, maxLength: 200 }
    PublicRequestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    LeadSyncRun:
      type: object
      required: [imported, error, tabStatuses]
      properties:
        # New rows inserted by this run (both tabs).
        imported: { type: integer }
        # Null when the sheet was read cleanly.
        error: { type: string, nullable: true }
        tabStatuses:
          type: array
          items: { $ref: "#/components/schemas/LeadSyncTabStatus" }
    LeadSyncTabStatus:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status: { type: string, enum: [read, failed] }
        error: { type: string }
        rowsSeen: { type: integer, minimum: 0 }
        eligibleRows: { type: integer, minimum: 0 }
        importedRows: { type: integer, minimum: 0 }
        duplicateRows: { type: integer, minimum: 0 }
        skippedRows: { type: integer, minimum: 0 }
        eligibilityWarning:
          type: string
          description: Explains why a readable tab had non-empty rows but no qualifying leads.
    LeadSyncStatus:
      type: object
      required:
        [
          configured,
          lastSyncAt,
          lastSuccessAt,
          lastError,
          warning,
          tabStatuses,
          stale,
        ]
      properties:
        configured:
          type: boolean
          description: True only when the shared Google Sheet lead feed is configured for the current company.
        lastSyncAt: { type: string, nullable: true }
        lastSuccessAt: { type: string, nullable: true }
        # Null when the last poll worked — the Leads page shows this verbatim.
        lastError: { type: string, nullable: true }
        # Non-fatal: set when the sheet carries a non-empty header the import
        # doesn't map to any stored field (hand-managed headers rename), so
        # the owner learns within a sync cycle instead of noticing blanks.
        warning: { type: string, nullable: true }
        # Results for every tab discovered during the latest pass. Empty when
        # the connector failed before tabs could be listed.
        tabStatuses:
          type: array
          items: { $ref: "#/components/schemas/LeadSyncTabStatus" }
        stale:
          type: boolean
          description: True when the automatic poller has missed three expected sync windows.
    LeadHeaderMapping:
      type: object
      required: [header, destination]
      properties:
        header: { type: string }
        destination:
          type: string
          enum: [service, bedrooms, bathrooms, dateOfServiceRequested]
        exampleAnswer:
          type: string
          description: A short example answer from the first data row, when present.
    LeadSyncPreviewTab:
      type: object
      required:
        [name, status, questionMappings, metadataHeaders, unmappedHeaders]
      properties:
        name: { type: string }
        status: { type: string, enum: [read, failed] }
        error: { type: string }
        questionMappings:
          type: array
          items: { $ref: "#/components/schemas/LeadHeaderMapping" }
        metadataHeaders:
          type: array
          items: { type: string }
        unmappedHeaders:
          type: array
          items: { type: string }
    LeadSyncPreview:
      type: object
      required: [tabs]
      properties:
        tabs:
          type: array
          items: { $ref: "#/components/schemas/LeadSyncPreviewTab" }
    ActivityItem:
      type: object
      required: [id, type, message, occurredAt]
      properties:
        id: { type: integer }
        type:
          {
            type: string,
            enum:
              [
                call_answered,
                booking_created,
                jobber_synced,
                jobber_sync_failed,
                quote_sent,
                quote_approved,
                deposit_paid,
                test_call,
                team_invited,
                join_code_changed,
                crew_assigned,
                reschedule_texted,
                text_given_up,
                job_started,
                job_finished,
                cleaner_running_late,
                cleaner_back_on_time,
                lead_converted,
                lead_request_received,
              ],
          }
        message: { type: string }
        occurredAt: { type: string }
        # True only for owner/dispatcher-visible "text_given_up" entries that
        # still carry the dropped text's payload.
        canResendText: { type: boolean }
        # The original E.164 target, shown in the resend confirmation form.
        # It is omitted for cleaners and for older owner-targeted rows whose
        # recipient was resolved at send time.
        resendPhone: { type: string }
        # A safe generic label only; record type/id never leave the server.
        resendSourceLabel: { type: string, enum: [team member, lead, client] }
        # For call-related entries (call_answered, test_call): the id of the
        # call this entry describes, so clients can link straight to its
        # detail screen. Absent on older rows and non-call entries.
        callId: { type: integer }
        # For booking-related entries (booking_created, crew_assigned,
        # job_started, job_finished): the id of the booking this entry
        # describes, so clients can link straight to its detail screen.
        # Absent on older rows and non-booking entries.
        bookingId: { type: integer }
    ResendGivenUpTextInput:
      type: object
      required: [toPhone]
      properties:
        toPhone:
          type: string
          pattern: "^\\+[1-9][0-9]{1,14}$"
          description: Recipient in E.164 format, for example +15551234567.
        saveToSource:
          type: boolean
          default: false
          description: Save the corrected number to the original company-owned record when it still exists.
    ResendGivenUpTextResult:
      type: object
      required: [queued, sourceUpdated]
      properties:
        queued: { type: boolean }
        sourceUpdated:
          type: boolean
          description: True when the corrected number was saved to the original company-owned record.
    MapConfig:
      type: object
      required: [apiKey, configured]
      properties:
        # The Google Maps JS key, served to authenticated dispatchers only so it
        # never has to be baked into the client bundle. Empty when unconfigured.
        apiKey: { type: string }
        configured: { type: boolean }
    AddressSuggestion:
      type: object
      required: [id, primary, secondary, full]
      properties:
        id: { type: string }
        # Street line, shown in bold.
        primary: { type: string }
        # City/region line. May be empty.
        secondary: { type: string }
        # The whole address — what goes in the box when this one is picked.
        full: { type: string }
    AddressSuggestions:
      type: object
      required: [suggestions, available]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/AddressSuggestion"
        # False when Google refuses the request for this key, so the box can say
        # suggestions are off rather than looking broken.
        available: { type: boolean }
    GeocodedAddress:
      type: object
      required: [found]
      properties:
        # False both for "no such place" and for a key that can't geocode; the
        # message says which, so the page never blames the typed address for a
        # configuration problem.
        found: { type: boolean }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        message: { type: ["string", "null"] }
    MapCleaner:
      type: object
      required: [teamMemberId, deviceId, isOwner, name, lat, lng, updatedAt]
      properties:
        teamMemberId: { type: integer }
        # One entry per DEVICE, not per person: somebody signed in on a phone
        # and a tablet is two pins, because a single pin would jump between
        # them. Group by teamMemberId to get back to the person.
        #
        # Null only for a fix stored before this device existed — such a row
        # still gets a pin (a crew member must never silently vanish from the
        # map), it just can't be named.
        deviceId: { type: ["integer", "null"] }
        # "Boss PC", "Richard's iPad" — shown on the marker whenever a person
        # has more than one device, so two pins are never anonymous.
        deviceLabel: { type: ["string", "null"] }
        platform: { type: ["string", "null"] }
        name: { type: string }
        # Their chosen colour, or null when the app should pick from their id.
        color: { type: ["string", "null"] }
        # True for the company owner's own seat. The map forces a
        # high-visibility yellow for these regardless of the stored colour, so
        # the boss is unmistakable among the crew.
        isOwner: { type: boolean }
        lat: { type: number }
        lng: { type: number }
        accuracy: { type: ["number", "null"] }
        updatedAt: { type: string }
    LivePositionAccess:
      type: object
      required: [allowed, reason]
      properties:
        # False when the server deliberately withheld live positions — the
        # payload really is empty, it is not a client-side filter. Dispatchers
        # may watch only inside working hours (company timezone); the owner
        # may watch at any hour.
        allowed: { type: boolean }
        # Why they were withheld, ready to render. Null when allowed.
        reason: { type: ["string", "null"] }
    MapJobAssignee:
      type: object
      required: [teamMemberId, name]
      properties:
        teamMemberId: { type: integer }
        name: { type: string }
        # Their chosen colour, or null when the app should pick from their id.
        # Carried on the assignee so the calendar and the map can colour work
        # without a second call the crew view isn't allowed to make.
        color: { type: ["string", "null"] }
    SavedRouteStop:
      type: object
      required:
        [
          id,
          routeId,
          position,
          name,
          address,
          lat,
          lng,
          linkedBookingId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        routeId: { type: integer }
        position: { type: integer }
        name: { type: string }
        address: { type: ["string", "null"] }
        lat: { type: number }
        lng: { type: number }
        linkedBookingId: { type: ["integer", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    SavedRoute:
      type: object
      required: [id, name, teamMemberId, createdAt, updatedAt, stops]
      properties:
        id: { type: integer }
        name: { type: string }
        teamMemberId: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        stops:
          {
            type: array,
            items: { $ref: "#/components/schemas/SavedRouteStop" },
          }
    SavedRouteInput:
      type: object
      required: [name, teamMemberId]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        teamMemberId: { type: integer }
    SavedRouteUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        teamMemberId: { type: integer }
    SavedRouteStopInput:
      type: object
      required: [name, lat, lng]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        address: { type: ["string", "null"] }
        lat: { type: number }
        lng: { type: number }
    SavedRouteStopUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        address: { type: ["string", "null"] }
        lat: { type: number }
        lng: { type: number }
    SavedRouteStopOrder:
      type: object
      required: [stopIds]
      properties:
        stopIds: { type: array, items: { type: integer }, minItems: 0 }
    MapJob:
      type: object
      required:
        [bookingId, customerName, lat, lng, scheduledFor, status, assignees]
      properties:
        bookingId: { type: integer }
        customerName: { type: string }
        customerAddress: { type: ["string", "null"] }
        lat: { type: number }
        lng: { type: number }
        scheduledFor: { type: string }
        status:
          { type: string, enum: [pending, confirmed, completed, canceled] }
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/MapJobAssignee"
        # How many jobs this pin stands for. Always 1 in the dated views, where
        # a pin is a visit. In `all` mode a pin is a place, so a house cleaned
        # every week is one marker carrying its visit count instead of fifty
        # markers stacked on the same roof.
        visits: { type: integer }
    MapPin:
      type: object
      required: [id, name, lat, lng]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: ["string", "null"] }
        lat: { type: number }
        lng: { type: number }
    StaffHome:
      type: object
      required: [teamMemberId, name, roleLabel, lat, lng, active]
      properties:
        teamMemberId: { type: integer }
        name: { type: string }
        # Their chosen colour, or null when the app should pick from their id.
        color: { type: ["string", "null"] }
        # "Lead Cleaner", "Cleaner", "Dispatcher" — what shows on their card.
        roleLabel: { type: string }
        address: { type: ["string", "null"] }
        lat: { type: number }
        lng: { type: number }
        active: { type: boolean }
    StaffWithoutHome:
      type: object
      required: [teamMemberId, name, roleLabel, active, reason]
      properties:
        teamMemberId: { type: integer }
        name: { type: string }
        roleLabel: { type: string }
        active: { type: boolean }
        # Whether there is no address on their card at all, or one that we
        # couldn't place on the map — those need different fixes.
        reason:
          type: string
          enum: [missing, unplaceable]
        address: { type: ["string", "null"] }
    MapOffice:
      type: object
      required: [deviceId, label, address, lat, lng]
      properties:
        deviceId: { type: integer }
        # The device's given name — "Tidyups Location".
        label: { type: string }
        address: { type: ["string", "null"] }
        # ALWAYS the stored company office location, never a reported browser
        # fix — the office cannot drift.
        lat: { type: number }
        lng: { type: number }
    MapData:
      type: object
      required:
        [
          cleaners,
          jobs,
          pins,
          staffHomes,
          staffWithoutHome,
          office,
          livePositions,
        ]
      properties:
        # The shop itself, drawn as a building parked on the stored company
        # location. Null until the owner marks a device as the office. A place
        # like the pins, so it is NOT withheld outside watching hours.
        office:
          oneOf:
            - $ref: "#/components/schemas/MapOffice"
            - type: "null"
        # One entry per reporting DEVICE. Empty (and `livePositions.allowed`
        # false) when the caller may not watch right now.
        cleaners:
          type: array
          items:
            $ref: "#/components/schemas/MapCleaner"
        livePositions:
          $ref: "#/components/schemas/LivePositionAccess"
        # Where each staff member lives. Home addresses are a colleague's
        # personal information, so dispatch sees the whole crew's and a cleaner
        # sees only their own.
        staffHomes:
          type: array
          items:
            $ref: "#/components/schemas/StaffHome"
        # The rest of the crew — everyone who has no pin because their card has
        # no home address, or one that couldn't be placed. Named rather than
        # silently absent: "who is closest" is unanswerable for these people,
        # and the office can only fix that if it knows who they are.
        staffWithoutHome:
          type: array
          items:
            $ref: "#/components/schemas/StaffWithoutHome"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/MapJob"
        pins:
          type: array
          items:
            $ref: "#/components/schemas/MapPin"
    MapRoutePoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
    MapDrivingRoute:
      type: object
      required: [distanceMeters, durationSeconds, path]
      properties:
        distanceMeters: { type: integer, minimum: 0 }
        durationSeconds: { type: integer, minimum: 0 }
        # Actual Google route geometry. This endpoint never substitutes a
        # straight line when routing is unavailable.
        path:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/MapRoutePoint"
    MapRouteLeg:
      type: object
      required:
        [
          teamMemberId,
          name,
          bookingId,
          customerName,
          destLat,
          destLng,
          scheduledFor,
          etaSeconds,
          distanceMeters,
          source,
          path,
        ]
      properties:
        teamMemberId: { type: integer }
        name: { type: string }
        # Their chosen colour, or null when the app should pick from their id.
        color: { type: ["string", "null"] }
        bookingId: { type: integer }
        customerName: { type: string }
        customerAddress: { type: ["string", "null"] }
        destLat: { type: number }
        destLng: { type: number }
        # When the job is booked for — the dashboard compares it with the ETA
        # to say "on time" or "running late".
        scheduledFor: { type: string }
        etaSeconds: { type: integer }
        distanceMeters: { type: integer }
        # `google` is a real driving route; `estimate` is the straight-line
        # arithmetic fallback and is drawn dashed and labelled "est.".
        source: { type: string, enum: [google, estimate] }
        # The line to draw, in order from the cleaner to the job.
        path:
          type: array
          items:
            $ref: "#/components/schemas/MapRoutePoint"
    MapRoutes:
      type: object
      required: [routes, livePositions]
      properties:
        routes:
          type: array
          items:
            $ref: "#/components/schemas/MapRouteLeg"
        # A trail starts at somebody's current position, so it is withheld on
        # exactly the same rule as the cars themselves.
        livePositions:
          $ref: "#/components/schemas/LivePositionAccess"
    JobberCalendarSync:
      type: object
      required:
        [imported, updated, skipped, canceled, jobberCount, hitPageLimit]
      properties:
        imported: { type: integer }
        updated: { type: integer }
        # Jobber jobs with no scheduled time, or one we couldn't read.
        skipped: { type: integer }
        # Imported bookings that have since disappeared from Jobber.
        canceled: { type: integer }
        jobberCount: { type: integer }
        # True when the account has more scheduled work than one sync can page
        # through; the cancellation sweep is skipped in that case.
        hitPageLimit: { type: boolean }
    BookingRangeItem:
      type: object
      required:
        [
          bookingId,
          customerName,
          service,
          scheduledFor,
          durationMinutes,
          status,
          located,
          assignees,
        ]
      properties:
        bookingId: { type: integer }
        customerName: { type: string }
        service: { type: string }
        scheduledFor: { type: string }
        # Falls back to the service's duration, else 120 minutes — the calendar
        # sizes a block by it, so it can never be null.
        durationMinutes: { type: integer }
        status:
          { type: string, enum: [pending, confirmed, completed, canceled] }
        # False when the booking has an address we haven't resolved yet (or no
        # address at all) — the calendar still shows it, the map can't pin it.
        located: { type: boolean }
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/MapJobAssignee"
    BookingRange:
      type: object
      required: [start, end, bookings]
      properties:
        start: { type: string }
        end: { type: string }
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/BookingRangeItem"
    StaffLocationInput:
      type: object
      required: []
      properties:
        lat: { type: ["number", "null"], minimum: -90, maximum: 90 }
        lng: { type: ["number", "null"], minimum: -180, maximum: 180 }
        accuracy: { type: ["number", "null"], minimum: 0 }
        # Which of this person's devices is reporting. Generated by the client
        # and kept locally so the same browser or handset keeps its pin across
        # sessions. The PERSON is always taken from the session — a device key
        # only ever selects among the caller's own devices, never somebody
        # else's. Omitted by clients that predate devices; those fold onto a
        # single legacy device for that person, exactly as before.
        deviceKey: { type: ["string", "null"], maxLength: 120 }
        # Does not contain coordinates or account identifiers. Used only to
        # associate a health-only reset report with the old device row.
        recoveryKey: { type: ["string", "null"], maxLength: 256 }
        # What to call this device on the map. Sent with every report so
        # renaming it is just the next report.
        deviceLabel: { type: ["string", "null"], maxLength: 60 }
        platform:
          type: ["string", "null"]
          enum: [web, ios, android, other, null]
        # Health-only reports carry no coordinates when permission is blocked.
        locationHealth:
          {
            type: string,
            enum: [unknown, granted, permission-denied, storage-cleared],
          }
    StaffLocation:
      type: object
      required: [status, teamMemberId]
      properties:
        # `recorded` — stored and now on the map.
        # A report is accepted only after the signed-in device has consented.
        status: { type: string, enum: [recorded] }
        teamMemberId: { type: integer }
        deviceId: { type: ["integer", "null"] }
        deviceLabel: { type: ["string", "null"] }
        platform: { type: ["string", "null"] }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        accuracy: { type: ["number", "null"] }
        updatedAt: { type: ["string", "null"] }
        # Plain-language explanation when nothing was stored.
        message: { type: ["string", "null"] }
        recoveryMatched: { type: boolean }
    StaffPresence:
      type: object
      required: [liveMemberIds, livePositions]
      properties:
        # Seats with at least one device that reported in the last few minutes
        # — the dashboard paints these with a green "live" dot on the
        # schedule. One entry per person however many devices they carry.
        liveMemberIds:
          type: array
          items: { type: integer }
        livePositions:
          $ref: "#/components/schemas/LivePositionAccess"
    StaffDeviceEntry:
      type: object
      required: [id, label, platform, live, isOffice]
      properties:
        id: { type: integer }
        label: { type: string }
        platform: { type: string }
        locationHealth:
          {
            type: string,
            enum: [unknown, granted, permission-denied, storage-cleared],
          }
        # This device IS the office: drawn as a building on the stored company
        # location, never on its reported position. At most one per company.
        isOffice: { type: boolean }
        # Null when this device has been registered but never reported.
        lastSeenAt: { type: ["string", "null"] }
        # Reported inside the shared five-minute window.
        live: { type: boolean }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        accuracy: { type: ["number", "null"] }
    StaffTrackedPerson:
      type: object
      required:
        [
          teamMemberId,
          name,
          roleLabel,
          isOwner,
          sharingEnabled,
          canChangeSharing,
          devices,
        ]
      properties:
        teamMemberId: { type: integer }
        name: { type: string }
        roleLabel: { type: string }
        color: { type: ["string", "null"] }
        # The owner's own seat: always tracked, always yellow on the map.
        isOwner: { type: boolean }
        sharingEnabled: { type: boolean }
        # False for the owner's own seat — their devices can't be switched off.
        canChangeSharing: { type: boolean }
        devices:
          type: array
          items:
            $ref: "#/components/schemas/StaffDeviceEntry"
    StaffDevices:
      type: object
      required: [people, livePositions]
      properties:
        people:
          type: array
          items:
            $ref: "#/components/schemas/StaffTrackedPerson"
        livePositions:
          $ref: "#/components/schemas/LivePositionAccess"
    RenameStaffDeviceInput:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
    SetOfficeDeviceInput:
      type: object
      required: [office]
      properties:
        # True to make this device the office (clearing any previous one),
        # false to put it back to normal live tracking.
        office: { type: boolean }
        # Where the office is. Required the first time a company marks an
        # office; afterwards the stored address is reused when omitted.
        # Geocoded server-side — the browser never sees the geocoding key.
        address: { type: ["string", "null"], maxLength: 300 }
    SetOfficeDeviceResult:
      type: object
      required: [deviceId, isOffice, address, lat, lng]
      properties:
        deviceId: { type: integer }
        isOffice: { type: boolean }
        # The company's stored office spot as it now stands (null only when
        # nothing has ever been stored).
        address: { type: ["string", "null"] }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
    ScheduleJob:
      type: object
      required: [bookingId, customerName, scheduledFor, durationMinutes, status]
      properties:
        bookingId: { type: integer }
        customerName: { type: string }
        # The crew standing outside a locked door needs to call the customer,
        # so this rides along on the day board rather than one tap deeper.
        customerPhone: { type: ["string", "null"] }
        customerAddress: { type: ["string", "null"] }
        scheduledFor: { type: string }
        # Falls back to the service's duration, else 120 minutes.
        durationMinutes: { type: integer }
        status:
          { type: string, enum: [pending, confirmed, completed, canceled] }
        price: { type: ["number", "null"] }
        # How far (and roughly how long) the drive is from the previous stop —
        # home for the first job of the day, the prior job after that. Null
        # when either end has no coordinates, or in the unassigned column.
        travel:
          anyOf:
            - $ref: "#/components/schemas/TravelLeg"
            - type: "null"
    TravelLeg:
      type: object
      required: [fromHome, fromLabel, distanceKm, driveMinutes]
      properties:
        # True when the leg starts at the cleaner's home address.
        fromHome: { type: boolean }
        # "home", or the previous job's customer name.
        fromLabel: { type: string }
        # Straight-line kilometres, one decimal.
        distanceKm: { type: number }
        # Rough city-driving estimate derived from the distance.
        driveMinutes: { type: integer }
    ScheduleCleaner:
      type: object
      required: [teamMemberId, name, jobs]
      properties:
        teamMemberId: { type: integer }
        name: { type: string }
        # Their chosen colour, or null when the app should pick from their id.
        color: { type: ["string", "null"] }
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleJob"
    Schedule:
      type: object
      required: [date, cleaners, unassigned]
      properties:
        date: { type: string }
        cleaners:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleCleaner"
        unassigned:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleJob"
    CreatePinInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        address: { type: ["string", "null"] }
        lat: { type: ["number", "null"], minimum: -90, maximum: 90 }
        lng: { type: ["number", "null"], minimum: -180, maximum: 180 }
    UpdatePinInput:
      type: object
      description:
        All fields optional — send only what changed. A new address without
        coordinates is geocoded server-side; explicit coordinates win.
      properties:
        name: { type: string, minLength: 1 }
        address: { type: ["string", "null"] }
        lat: { type: ["number", "null"], minimum: -90, maximum: 90 }
        lng: { type: ["number", "null"], minimum: -180, maximum: 180 }
    ClientRecord:
      type: object
      required: [id, name, source, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        # As typed/received; may be blank for a Jobber client with no number.
        phone: { type: ["string", "null"] }
        # Normalized +E.164 when the number was dialable, for digit search.
        phoneE164: { type: ["string", "null"] }
        tag:
          type: ["string", "null"]
          enum: [client, good_lead, bad_lead, spam, null]
        email: { type: ["string", "null"] }
        streetAddress: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        province: { type: ["string", "null"] }
        postalCode: { type: ["string", "null"] }
        # Set once the customer exists in Jobber too.
        jobberClientId: { type: ["string", "null"] }
        # Where this customer was first seen: booking | jobber | lead.
        source: { type: string }
        createdAt: { type: string, format: date-time }
    ClientInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        streetAddress: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        province: { type: ["string", "null"] }
        postalCode: { type: ["string", "null"] }
    ClientUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        streetAddress: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        province: { type: ["string", "null"] }
        postalCode: { type: ["string", "null"] }
    Caller:
      type: object
      required:
        [
          id,
          phone,
          phoneE164,
          bestName,
          firstCallAt,
          latestCallAt,
          callCount,
          knownClient,
        ]
      properties:
        id: { type: integer }
        phone: { type: string }
        phoneE164: { type: string }
        bestName: { type: string }
        firstCallAt: { type: string, format: date-time }
        latestCallAt: { type: string, format: date-time }
        callCount: { type: integer }
        clientId: { type: ["integer", "null"] }
        knownClient: { type: boolean }
        quoContactId: { type: ["string", "null"] }
    JobberQuote:
      type: object
      required: [id, jobberQuoteId, status, lastSyncedAt]
      properties:
        id: { type: integer }
        jobberQuoteId: { type: string }
        quoteNumber: { type: ["integer", "null"] }
        title: { type: ["string", "null"] }
        clientName: { type: ["string", "null"] }
        clientPhone: { type: ["string", "null"] }
        propertyAddress: { type: ["string", "null"] }
        # Jobber's status verbatim (draft, awaiting_response, changes_requested,
        # approved, converted, archived). Deliberately NOT an enum: a status
        # Jobber adds later must not make the whole list fail validation.
        status: { type: string }
        totalCents: { type: ["integer", "null"] }
        # Deep link to the quote inside Jobber.
        jobberWebUri: { type: ["string", "null"] }
        jobberCreatedAt: { type: ["string", "null"], format: date-time }
        sentAt: { type: ["string", "null"], format: date-time }
        transitionedAt: { type: ["string", "null"], format: date-time }
        lastSyncedAt: { type: string, format: date-time }
    JobberInvoice:
      type: object
      required: [id, jobberInvoiceId, status, lastSyncedAt]
      properties:
        id: { type: integer }
        jobberInvoiceId: { type: string }
        # Jobber's invoice number is a string in their API (may carry prefixes).
        invoiceNumber: { type: ["string", "null"] }
        subject: { type: ["string", "null"] }
        clientName: { type: ["string", "null"] }
        clientPhone: { type: ["string", "null"] }
        tag:
          type: ["string", "null"]
          enum: [client, good_lead, bad_lead, spam, null]
        propertyAddress: { type: ["string", "null"] }
        # Jobber's status verbatim (draft, awaiting_payment, paid, past_due,
        # bad_debt, sent_not_due). Deliberately NOT an enum: a status Jobber
        # adds later must not make the whole list fail validation.
        status: { type: string }
        totalCents: { type: ["integer", "null"] }
        # What is still owing; zero once paid.
        balanceCents: { type: ["integer", "null"] }
        # Deep link to the invoice inside Jobber.
        jobberWebUri: { type: ["string", "null"] }
        issuedAt: { type: ["string", "null"], format: date-time }
        dueAt: { type: ["string", "null"], format: date-time }
        jobberCreatedAt: { type: ["string", "null"], format: date-time }
        lastSyncedAt: { type: string, format: date-time }
    CustomerTagResult:
      type: object
      required: [kind, id, tag]
      properties:
        kind: { type: string, enum: [lead, call, booking, invoice, client] }
        id: { type: integer }
        tag:
          type: ["string", "null"]
          enum: [client, good_lead, bad_lead, spam, null]
