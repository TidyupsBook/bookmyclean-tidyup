name: Physical-device speech smoke
run-name: Speech smoke for ${{ inputs.candidate_ref }}

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Immutable Git ref used to build the candidates
        required: true
        type: string
      ios_build_url:
        description: URL of the iOS candidate
        required: true
        type: string
      android_build_url:
        description: URL of the Android candidate
        required: true
        type: string
  workflow_call:
    inputs:
      candidate_ref:
        description: Immutable Git ref used to build the candidates
        required: true
        type: string
      ios_build_url:
        description: URL of the iOS candidate
        required: true
        type: string
      android_build_url:
        description: URL of the Android candidate
        required: true
        type: string
    outputs:
      ios_result:
        description: Result of the iOS physical-device job
        value: ${{ jobs.results.outputs.ios_result }}
      android_result:
        description: Result of the Android physical-device job
        value: ${{ jobs.results.outputs.android_result }}

permissions:
  contents: read

jobs:
  ios:
    name: iOS physical device (${{ inputs.candidate_ref }})
    runs-on: [self-hosted, macOS, ios-physical-device]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/owner-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}

      - name: Download and install iOS candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          IOS_BUILD_URL: ${{ inputs.ios_build_url }}
          IOS_DEVICE_ID: ${{ vars.IOS_DEVICE_ID }}
        run: |
          test -n "$IOS_DEVICE_ID" || {
            echo "::error::IOS_DEVICE_ID repository variable is required"
            exit 1
          }
          rm -rf build/release-candidate build/ios-payload
          mkdir -p build/release-candidate build/ios-payload
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            "$IOS_BUILD_URL" \
            --output build/release-candidate/owner-mobile-ios.ipa
          unzip -q build/release-candidate/owner-mobile-ios.ipa \
            -d build/ios-payload
          IOS_APP="$(find build/ios-payload/Payload -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$IOS_APP" || {
            echo "::error::The iOS candidate asset contains no installable app"
            exit 1
          }
          xcrun devicectl device install app \
            --device "$IOS_DEVICE_ID" \
            "$IOS_APP"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          BUILD_SHA256="$(shasum -a 256 build/release-candidate/owner-mobile-ios.ipa | cut -d ' ' -f 1)"
          {
            echo "## iOS release-candidate speech check"
            echo
            echo "- Candidate ref: \`$CANDIDATE_REF\`"
            echo "- Candidate build: $IOS_BUILD_URL"
            echo "- Candidate commit: \`$CANDIDATE_SHA\`"
            echo "- Installed asset: \`owner-mobile-ios.ipa\`"
            echo "- SHA-256: \`$BUILD_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run installed-build speech smoke
        id: speech_smoke
        continue-on-error: true
        run: pnpm run smoke:ios

      - name: Add failed speech diagnostics to run summary
        if: always() && steps.speech_smoke.outcome == 'failure'
        run: node scripts/summarize-speech-smoke.mjs ios build/maestro-results/ios

      - name: Upload failed Maestro output
        if: always() && steps.speech_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: speech-smoke-maestro-ios
          path: artifacts/owner-mobile/build/maestro-results/ios
          if-no-files-found: warn

      - name: Fail job when speech smoke failed
        if: always() && steps.speech_smoke.outcome == 'failure'
        run: exit 1

  android:
    name: Android physical device (${{ inputs.candidate_ref }})
    runs-on: [self-hosted, android-physical-device]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/owner-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}

      - name: Download and install Android candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          ANDROID_BUILD_URL: ${{ inputs.android_build_url }}
          ANDROID_DEVICE_ID: ${{ vars.ANDROID_DEVICE_ID }}
        run: |
          test -n "$ANDROID_DEVICE_ID" || {
            echo "::error::ANDROID_DEVICE_ID repository variable is required"
            exit 1
          }
          rm -rf build/release-candidate
          mkdir -p build/release-candidate
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            "$ANDROID_BUILD_URL" \
            --output build/release-candidate/owner-mobile-android.apk
          adb -s "$ANDROID_DEVICE_ID" install -r \
            build/release-candidate/owner-mobile-android.apk
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          BUILD_SHA256="$(sha256sum build/release-candidate/owner-mobile-android.apk | cut -d ' ' -f 1)"
          {
            echo "## Android release-candidate speech check"
            echo
            echo "- Candidate ref: \`$CANDIDATE_REF\`"
            echo "- Candidate build: $ANDROID_BUILD_URL"
            echo "- Candidate commit: \`$CANDIDATE_SHA\`"
            echo "- Installed asset: \`owner-mobile-android.apk\`"
            echo "- SHA-256: \`$BUILD_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run installed-build speech smoke
        id: speech_smoke
        continue-on-error: true
        run: pnpm run smoke:android

      - name: Add failed speech diagnostics to run summary
        if: always() && steps.speech_smoke.outcome == 'failure'
        run: node scripts/summarize-speech-smoke.mjs android build/maestro-results/android

      - name: Upload failed Maestro output
        if: always() && steps.speech_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: speech-smoke-maestro-android
          path: artifacts/owner-mobile/build/maestro-results/android
          if-no-files-found: warn

      - name: Fail job when speech smoke failed
        if: always() && steps.speech_smoke.outcome == 'failure'
        run: exit 1

  results:
    name: Record physical-device results
    if: always()
    needs: [ios, android]
    runs-on: ubuntu-latest
    outputs:
      ios_result: ${{ needs.ios.result }}
      android_result: ${{ needs.android.result }}
    steps:
      - name: Record results
        env:
          IOS_RESULT: ${{ needs.ios.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          echo "iOS result: $IOS_RESULT"
          echo "Android result: $ANDROID_RESULT"
