name: Mobile release
run-name: Verify and release ${{ github.event.release.tag_name }}

on:
  release:
    types: [prereleased]

permissions:
  contents: read

jobs:
  physical-device-speech:
    name: Physical-device speech checks
    uses: ./.github/workflows/physical-device-speech-smoke.yml
    with:
      candidate_tag: ${{ github.event.release.tag_name }}

  release:
    name: Approve mobile release
    needs: physical-device-speech
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          CANDIDATE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F prerelease=false \
            -F draft=false
          {
            echo "## Mobile release approved"
            echo
            echo "Both physical-device speech checks passed."
            echo
            echo "Released candidate: [$CANDIDATE_TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$CANDIDATE_TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
