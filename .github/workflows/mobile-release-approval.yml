name: Mobile release approval
run-name: Verify and release ${{ github.event.release.tag_name }}

on:
  pull_request:
    paths:
      - .github/actionlint.yaml
      - .github/actions/verify-mobile-candidate/action.yml
      - .github/workflows/mobile-release-approval.yml
      - .github/workflows/physical-device-speech-smoke.yml
      - scripts/download-private-release-asset.sh
      - scripts/mobile-release-workflow-contract.test.mjs
  release:
    types: [prereleased]

permissions:
  contents: read

jobs:
  moved-tag-sha-fixture:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/physical-device-speech-smoke.yml
    with:
      candidate_ref: ${{ github.sha }}
      expected_candidate_sha: ${{ github.sha }}
      ios_build_url: https://ci.invalid/not-downloaded.ipa
      android_build_url: https://ci.invalid/not-downloaded.apk
      sha_mismatch_fixture: true

  validate-workflows:
    name: Validate mobile workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: >-
            .github/workflows/mobile-release-approval.yml
            .github/workflows/physical-device-speech-smoke.yml
      - name: Check release-gate wiring
        run: node --test scripts/mobile-release-workflow-contract.test.mjs

  private-asset-downloads:
    name: Check private prerelease asset downloads
    if: github.event_name == 'release'
    needs: validate-workflows
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate_metadata.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Record immutable candidate metadata
        id: candidate_metadata
        run: echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Download representative iOS and Android assets
        env:
          GH_TOKEN: ${{ github.token }}
          IOS_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/owner-mobile-ios.ipa
          ANDROID_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/owner-mobile-android.apk
        run: |
          scripts/download-private-release-asset.sh \
            iOS "$IOS_BUILD_URL" "$RUNNER_TEMP/owner-mobile-ios.ipa"
          scripts/download-private-release-asset.sh \
            Android "$ANDROID_BUILD_URL" "$RUNNER_TEMP/owner-mobile-android.apk"

  physical-device-speech:
    name: Physical-device speech checks
    if: github.event_name == 'release'
    needs: [validate-workflows, private-asset-downloads]
    uses: ./.github/workflows/physical-device-speech-smoke.yml
    with:
      candidate_ref: ${{ github.event.release.tag_name }}
      expected_candidate_sha: ${{ needs.private-asset-downloads.outputs.candidate_sha }}
      ios_build_url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/owner-mobile-ios.ipa
      android_build_url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/owner-mobile-android.apk

  release:
    name: Approve mobile release
    if: always() && github.event_name == 'release'
    needs: [validate-workflows, private-asset-downloads, physical-device-speech]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require successful workflow and device results
        env:
          VALIDATION_RESULT: ${{ needs.validate-workflows.result }}
          ASSET_DOWNLOAD_RESULT: ${{ needs.private-asset-downloads.result }}
          DEVICE_WORKFLOW_RESULT: ${{ needs.physical-device-speech.result }}
          IOS_RESULT: ${{ needs.physical-device-speech.outputs.ios_result }}
          ANDROID_RESULT: ${{ needs.physical-device-speech.outputs.android_result }}
        run: |
          test "$VALIDATION_RESULT" = success
          test "$ASSET_DOWNLOAD_RESULT" = success
          test "$DEVICE_WORKFLOW_RESULT" = success
          test "$IOS_RESULT" = success
          test "$ANDROID_RESULT" = success

      - name: Promote verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          CANDIDATE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F prerelease=false \
            -F draft=false
          {
            echo "## Mobile release approved"
            echo
            echo "Both physical-device speech checks passed."
            echo
            echo "Released candidate: [$CANDIDATE_TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$CANDIDATE_TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
