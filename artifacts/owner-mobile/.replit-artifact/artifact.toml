kind = "mobile"
previewPath = "/owner-mobile/"
title = "Book My Cleaning Mobile"
description = "A mobile companion app for cleaning-company owners to check today's and tomorrow's bookings on the go. Signs in against the same backend and Clerk tenant as the web dashboard, shows job details with quote/deposit status, and surfaces recent activity including Quo outages and failed Jobber syncs."
version = "1.0.0"
id = "artifacts/owner-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/owner-mobile/" ]
localPort = 24174

[services.development]
run = "pnpm --filter @workspace/owner-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/owner-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/owner-mobile", "run", "serve" ]

[services.env]
PORT = "24174"
BASE_PATH = "/owner-mobile/"
